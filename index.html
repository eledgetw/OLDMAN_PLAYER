                            <div class="sidebar-desc" style="font-size:12px; color:#9ca3af; margin-bottom:16px; line-height:1.6;">拖曳下方按鈕至左側文件建立錨點。<br>點擊按鈕可跳轉對應頁面。</div>
                        </div>
                    </div>
                </div>
            </body>
            </html>
            `);
        sheetWindow.document.close();

        setTimeout(() => {
          setupChildWindow(sheetWindow);
        }, 100);
      });

      // 定義子視窗的邏輯
      function setupChildWindow(win) {
        const doc = win.document;
        const pdfUpload = doc.getElementById("pdf-upload");
        const pdfViewerContainer = doc.getElementById("pdf-viewer-container");
        const scaleWrapper = doc.getElementById("pdf-scale-wrapper");
        const zoomDisplay = doc.getElementById("zoom-display");

        // 標籤大小控制邏輯
        window.globalAnchorScale = window.globalAnchorScale || 0.5;
        const updateAnchorSize = (delta) => {
          window.globalAnchorScale = Math.max(
            0.3,
            Math.min(3.0, window.globalAnchorScale + delta),
          );
          doc.documentElement.style.setProperty(
            "--anchor-scale",
            window.globalAnchorScale,
          );
        };
        const btnUp = doc.getElementById("anchor-size-up");
        const btnDown = doc.getElementById("anchor-size-down");
        if (btnUp) btnUp.onclick = () => updateAnchorSize(0.1);
        if (btnDown) btnDown.onclick = () => updateAnchorSize(-0.1);
        doc.documentElement.style.setProperty(
          "--anchor-scale",
          window.globalAnchorScale,
        );

        // --- 文字功能狀態 ---
        let isTextMode = false;
        const textToolBtn = doc.getElementById("text-tool-btn");
        const textPanel = doc.getElementById("text-editor-panel");

        // 全域文字樣式（預設無外框、無背景）
        let currentTextProps = {
          stroke: "#dc2626",      // 文字顏色（亮紅）
          bg: "transparent",     // 預設無背景
          borderWidth: 1,
          borderStyle: "none",   // 預設無外框
          fontSize: 24,
          align: "center",
          direction: "horizontal",
          bold: false,
          italic: false,
          underline: false,
        };

        if (textPanel) {
          textPanel.style.maxHeight = "calc(100vh - 80px)";
          textPanel.style.overflowY = "auto";
          textPanel.style.overscrollBehavior = "contain";
        }

        // --- 方框功能狀態 (符合附圖預設值) ---
        let isBoxMode = false;
        const boxToolBtn = doc.getElementById("box-tool-btn");
        const boxPanel = doc.getElementById("box-editor-panel");

        let currentBoxProps = {
          stroke: "#dc2626", // 預設紅框
          bg: "transparent", // 預設透明底
          borderWidth: 4,    // 預設粗線
          borderStyle: "solid",
          borderRadius: 12,  // 預設圓角
        };

        if (boxPanel) {
          boxPanel.style.maxHeight = "calc(100vh - 80px)";
          boxPanel.style.overflowY = "auto";
          boxPanel.style.overscrollBehavior = "contain";
        }

        // 面板通用拖曳綁定函數
        function makePanelDraggable(panelEl, headerEl) {
          if (!panelEl || !headerEl) return;
          let isDragging = false;
          let startX = 0, startY = 0;
          let initialLeft = 0, initialTop = 0;

          const onStart = (e) => {
            if (e.target.closest("button")) return;
            isDragging = true;
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            startX = clientX;
            startY = clientY;
            const rect = panelEl.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
            panelEl.style.right = "auto";
            panelEl.style.bottom = "auto";
            panelEl.style.left = initialLeft + "px";
            panelEl.style.top = initialTop + "px";
          };

          const onMove = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            const dx = clientX - startX;
            const dy = clientY - startY;
            panelEl.style.left = Math.max(10, Math.min(doc.body.clientWidth - panelEl.offsetWidth - 10, initialLeft + dx)) + "px";
            panelEl.style.top = Math.max(10, Math.min(doc.body.clientHeight - panelEl.offsetHeight - 10, initialTop + dy)) + "px";
          };

          const onEnd = () => { isDragging = false; };

          headerEl.addEventListener("pointerdown", onStart);
          win.addEventListener("pointermove", onMove);
          win.addEventListener("pointerup", onEnd);
        }

        makePanelDraggable(textPanel, doc.querySelector(".panel-header"));
        makePanelDraggable(boxPanel, doc.getElementById("box-panel-header"));

        // 切換工具按鈕外觀
        function updateToolButtonsUI() {
          if (textToolBtn) {
            if (isTextMode) {
              textToolBtn.style.setProperty("background", "#2563eb", "important");
              textToolBtn.style.setProperty("color", "#ffffff", "important");
            } else {
              textToolBtn.style.setProperty("background", "#4b5563", "important");
              textToolBtn.style.setProperty("color", "white", "important");
            }
          }
          if (boxToolBtn) {
            if (isBoxMode) {
              boxToolBtn.style.setProperty("background", "#2563eb", "important");
              boxToolBtn.style.setProperty("color", "#ffffff", "important");
            } else {
              boxToolBtn.style.setProperty("background", "#4b5563", "important");
              boxToolBtn.style.setProperty("color", "white", "important");
            }
          }
          if (pdfViewerContainer) {
            pdfViewerContainer.style.cursor = (isTextMode || isBoxMode) ? "crosshair" : "default";
          }
        }

        if (textToolBtn) {
          textToolBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            isTextMode = !isTextMode;
            if (isTextMode) isBoxMode = false;
            updateToolButtonsUI();
            if (isTextMode && textPanel) {
              textPanel.style.display = "block";
              if (boxPanel) boxPanel.style.display = "none";
              syncTextPanelUI(currentTextProps);
            }
          };
        }

        if (boxToolBtn) {
          boxToolBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            isBoxMode = !isBoxMode;
            if (isBoxMode) isTextMode = false;
            updateToolButtonsUI();
            if (isBoxMode && boxPanel) {
              boxPanel.style.display = "block";
              if (textPanel) textPanel.style.display = "none";
              syncBoxPanelUI(currentBoxProps);
            }
          };
        }

        const closeTextPanelBtn = doc.getElementById("close-text-panel");
        if (closeTextPanelBtn) {
          closeTextPanelBtn.onclick = (e) => {
            e.stopPropagation();
            if (textPanel) textPanel.style.display = "none";
            if (activeTextId) {
              const el = doc.getElementById(`text-item-${activeTextId}`);
              if (el) el.classList.remove("selected");
              activeTextId = null;
            }
          };
        }

        const closeBoxPanelBtn = doc.getElementById("close-box-panel");
        if (closeBoxPanelBtn) {
          closeBoxPanelBtn.onclick = (e) => {
            e.stopPropagation();
            if (boxPanel) boxPanel.style.display = "none";
            if (activeBoxId) {
              const el = doc.getElementById(`box-item-${activeBoxId}`);
              if (el) el.classList.remove("selected");
              activeBoxId = null;
            }
          };
        }

        // --- 文字面板樣式同步與更新 ---
        function updateActiveTextProps(mutator) {
          mutator(currentTextProps);
          if (activeTextId) {
            const item = pdfTextAnnotations.find((t) => t.id === activeTextId);
            if (item) {
              mutator(item);
              window.renderPdfTextAnnotations(win);
              try { saveState(); } catch (err) {}
            }
          }
          syncTextPanelUI(currentTextProps);
        }

        function syncTextPanelUI(item) {
          doc.querySelectorAll("#stroke-color-grid .color-btn").forEach((b) => b.classList.toggle("active", b.dataset.stroke === item.stroke));
          doc.querySelectorAll("#bg-color-grid .color-btn").forEach((b) => b.classList.toggle("active", b.dataset.bg === item.bg));
          doc.querySelectorAll("#border-width-control .segment-item").forEach((b) => b.classList.toggle("active", parseInt(b.dataset.width) === item.borderWidth));
          doc.querySelectorAll("#border-style-control .segment-item").forEach((b) => b.classList.toggle("active", b.dataset.style === item.borderStyle));
          const fontSizeEl = doc.getElementById("font-size-val");
          if (fontSizeEl) fontSizeEl.textContent = item.fontSize;
          doc.querySelectorAll("#text-align-control .segment-item").forEach((b) => b.classList.toggle("active", b.dataset.align === item.align));
          doc.querySelectorAll("#writing-dir-control .segment-item").forEach((b) => b.classList.toggle("active", b.dataset.dir === item.direction));
          doc.querySelectorAll("#text-format-control .segment-item").forEach((b) => b.classList.toggle("active", !!item[b.dataset.format]));
        }

        doc.querySelectorAll("#stroke-color-grid .color-btn").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveTextProps((item) => (item.stroke = btn.dataset.stroke)); };
        });
        doc.querySelectorAll("#bg-color-grid .color-btn").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveTextProps((item) => (item.bg = btn.dataset.bg)); };
        });
        doc.querySelectorAll("#border-width-control .segment-item").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveTextProps((item) => (item.borderWidth = parseInt(btn.dataset.width))); };
        });
        doc.querySelectorAll("#border-style-control .segment-item").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveTextProps((item) => (item.borderStyle = btn.dataset.style)); };
        });
        const fsDec = doc.getElementById("font-size-dec");
        if (fsDec) fsDec.onclick = (e) => { e.stopPropagation(); updateActiveTextProps((item) => (item.fontSize = Math.max(10, item.fontSize - 2))); };
        const fsInc = doc.getElementById("font-size-inc");
        if (fsInc) fsInc.onclick = (e) => { e.stopPropagation(); updateActiveTextProps((item) => (item.fontSize = Math.min(72, item.fontSize + 2))); };
        doc.querySelectorAll("#text-align-control .segment-item").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveTextProps((item) => (item.align = btn.dataset.align)); };
        });
        doc.querySelectorAll("#writing-dir-control .segment-item").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveTextProps((item) => (item.direction = btn.dataset.dir)); };
        });
        doc.querySelectorAll("#text-format-control .segment-item").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); const key = btn.dataset.format; updateActiveTextProps((item) => (item[key] = !item[key])); };
        });

        // --- 方框面板樣式同步與更新 (附圖) ---
        function updateActiveBoxProps(mutator) {
          mutator(currentBoxProps);
          if (activeBoxId) {
            const item = pdfBoxAnnotations.find((b) => b.id === activeBoxId);
            if (item) {
              mutator(item);
              window.renderPdfBoxAnnotations(win);
              try { saveState(); } catch (err) {}
            }
          }
          syncBoxPanelUI(currentBoxProps);
        }

        function syncBoxPanelUI(item) {
          doc.querySelectorAll("#box-stroke-grid .color-btn").forEach((b) => b.classList.toggle("active", b.dataset.stroke === item.stroke));
          doc.querySelectorAll("#box-bg-grid .color-btn").forEach((b) => b.classList.toggle("active", b.dataset.bg === item.bg));
          doc.querySelectorAll("#box-width-control .segment-item").forEach((b) => b.classList.toggle("active", parseInt(b.dataset.width) === item.borderWidth));
          doc.querySelectorAll("#box-style-control .segment-item").forEach((b) => b.classList.toggle("active", b.dataset.style === item.borderStyle));
          doc.querySelectorAll("#box-edges-control .segment-item").forEach((b) => b.classList.toggle("active", parseInt(b.dataset.radius) === item.borderRadius));
        }

        doc.querySelectorAll("#box-stroke-grid .color-btn").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveBoxProps((item) => (item.stroke = btn.dataset.stroke)); };
        });
        doc.querySelectorAll("#box-bg-grid .color-btn").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveBoxProps((item) => (item.bg = btn.dataset.bg)); };
        });
        doc.querySelectorAll("#box-width-control .segment-item").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveBoxProps((item) => (item.borderWidth = parseInt(btn.dataset.width))); };
        });
        doc.querySelectorAll("#box-style-control .segment-item").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveBoxProps((item) => (item.borderStyle = btn.dataset.style)); };
        });
        doc.querySelectorAll("#box-edges-control .segment-item").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); updateActiveBoxProps((item) => (item.borderRadius = parseInt(btn.dataset.radius))); };
        });

        // 左右拖曳寬度
        const vResizer = doc.getElementById("v-resizer");
        const sidebar = doc.getElementById("sheet-regions-list");
        let isResizingWidth = false;

        if (vResizer && sidebar) {
          const startResizeWidth = (e) => {
            isResizingWidth = true;
            doc.body.style.cursor = "col-resize";
            doc.body.style.userSelect = "none";
          };
          const doResizeWidth = (e) => {
            if (!isResizingWidth) return;
            const clientX = e.type.includes("touch") ? e.touches[0].clientX : e.clientX;
            const newWidth = doc.body.clientWidth - clientX;
            if (newWidth >= 70 && newWidth < doc.body.clientWidth * 0.5) {
              sidebar.style.width = newWidth + "px";
            }
          };
          const stopResizeWidth = () => {
            if (isResizingWidth) {
              isResizingWidth = false;
              doc.body.style.cursor = "";
              doc.body.style.userSelect = "";
            }
          };

          vResizer.addEventListener("mousedown", startResizeWidth);
          vResizer.addEventListener("touchstart", startResizeWidth, { passive: true });
          doc.addEventListener("mousemove", doResizeWidth);
          doc.addEventListener("touchmove", doResizeWidth, { passive: true });
          doc.addEventListener("mouseup", stopResizeWidth);
          doc.addEventListener("touchend", stopResizeWidth);
        }

        let currentPdfDoc = null;
        win.pdfPagesRendered = [];
        let pdfZoom = 1.0;

        function setPdfZoom(z) {
          pdfZoom = Math.max(0.05, Math.min(2.0, z));
          zoomDisplay.textContent = Math.round(pdfZoom * 100) + "%";
          scaleWrapper.style.zoom = pdfZoom;
          const zoomSlider = doc.getElementById("zoom-slider");
          if (zoomSlider && zoomSlider.value !== pdfZoom.toString()) {
            zoomSlider.value = pdfZoom;
          }
        }

        const zoomSlider = doc.getElementById("zoom-slider");
        if (zoomSlider) {
          zoomSlider.addEventListener("input", (e) => setPdfZoom(parseFloat(e.target.value)));
        }

        const zoomFitBtn = doc.getElementById("zoom-fit-btn");
        if (zoomFitBtn) {
          zoomFitBtn.onclick = () => {
            if (win.pdfPagesRendered && win.pdfPagesRendered.length > 0) {
              const pdfViewerContainer = doc.getElementById("pdf-viewer-container");
              const containerWidth = pdfViewerContainer.clientWidth - 45;
              const originalPageWidth = win.pdfPagesRendered[0].viewport.width;
              const fitZoom = containerWidth / originalPageWidth;
              setPdfZoom(fitZoom);
            }
          };
        }

        const zoomFitHeightBtn = doc.getElementById("zoom-fit-height-btn");
        if (zoomFitHeightBtn) {
          zoomFitHeightBtn.onclick = () => {
            if (win.pdfPagesRendered && win.pdfPagesRendered.length > 0) {
              const pdfViewerContainer = doc.getElementById("pdf-viewer-container");
              const containerHeight = pdfViewerContainer.clientHeight - 45;
              const originalPageHeight = win.pdfPagesRendered[0].viewport.height;
              const fitZoom = containerHeight / originalPageHeight;
              setPdfZoom(fitZoom);
            }
          };
        }

        pdfViewerContainer.addEventListener(
          "wheel",
          (e) => {
            if (e.ctrlKey || e.metaKey) {
              e.preventDefault();
              const delta = e.deltaY > 0 ? -0.1 : 0.1;
              setPdfZoom(pdfZoom + delta);
            }
          },
          { passive: false },
        );

        let initialDist = 0;
        let startZoom = 1;
        pdfViewerContainer.addEventListener(
          "touchstart",
          (e) => {
            if (e.touches.length === 2) {
              initialDist = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY,
              );
              startZoom = pdfZoom;
            }
          },
          { passive: false },
        );

        pdfViewerContainer.addEventListener(
          "touchmove",
          (e) => {
            if (e.touches.length === 2) {
              e.preventDefault();
              const currentDist = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY,
              );
              setPdfZoom(startZoom * (currentDist / initialDist));
            }
          },
          { passive: false },
        );

        const exportPdfBtn = doc.getElementById("export-pdf-btn");
        if (exportPdfBtn) {
          exportPdfBtn.onclick = async () => {
            if (!win.pdfPagesRendered || win.pdfPagesRendered.length === 0) {
              win.alert("尚未載入任何 PDF 樂譜！");
              return;
            }

            // 動態載入 jsPDF 函式庫
            if (!win.jspdf) {
              const prevText = exportPdfBtn.textContent;
              exportPdfBtn.textContent = "載入組件...";
              await new Promise((resolve, reject) => {
                const script = doc.createElement("script");
                script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
                script.onload = resolve;
                script.onerror = reject;
                doc.head.appendChild(script);
              });
              exportPdfBtn.textContent = prevText;
            }

            const originalBtnText = exportPdfBtn.textContent;
            exportPdfBtn.textContent = "匯出中...";
            exportPdfBtn.disabled = true;

            try {
              const { jsPDF } = win.jspdf;
              let pdfDoc = null;

              for (let idx = 0; idx < win.pdfPagesRendered.length; idx++) {
                const pageData = win.pdfPagesRendered[idx];
                const pageNum = idx + 1;
                const origCanvas = pageData.container.querySelector("canvas");
                const w = origCanvas.width;
                const h = origCanvas.height;

                // 建立用於合成原譜、方框與文字的高解析離屏畫布
                const mergeCanvas = doc.createElement("canvas");
                mergeCanvas.width = w;
                mergeCanvas.height = h;
                const ctx = mergeCanvas.getContext("2d");

                // 1. 繪製原始樂譜背景
                ctx.drawImage(origCanvas, 0, 0);

                // 2. 繪製方框註記
                const pageBoxes = pdfBoxAnnotations.filter((b) => b.pageNum === pageNum);
                pageBoxes.forEach((box) => {
                  const bx = box.xRatio * w;
                  const by = box.yRatio * h;
                  const bw = box.widthRatio * w;
                  const bh = box.heightRatio * h;
                  const radius = (box.borderRadius || 0) * (w / (pageData.container.offsetWidth || w));

                  ctx.save();
                  ctx.beginPath();
                  if (ctx.roundRect) {
                    ctx.roundRect(bx, by, bw, bh, radius);
                  } else {
                    ctx.rect(bx, by, bw, bh);
                  }

                  if (box.bg && box.bg !== "transparent") {
                    ctx.fillStyle = box.bg;
                    ctx.fill();
                  }

                  if (box.borderStyle && box.borderStyle !== "none") {
                    ctx.strokeStyle = box.stroke || "#dc2626";
                    ctx.lineWidth = (box.borderWidth || 2) * (w / (pageData.container.offsetWidth || w));

                    if (box.borderStyle === "dashed") {
                      ctx.setLineDash([ctx.lineWidth * 3, ctx.lineWidth * 2]);
                    } else if (box.borderStyle === "dotted") {
                      ctx.setLineDash([ctx.lineWidth, ctx.lineWidth * 1.5]);
                    } else {
                      ctx.setLineDash([]);
                    }
                    ctx.stroke();
                  }
                  ctx.restore();
                });

                // 3. 繪製文字註記
                const pageTexts = pdfTextAnnotations.filter((t) => t.pageNum === pageNum);
                pageTexts.forEach((textItem) => {
                  const tx = textItem.xRatio * w;
                  const ty = textItem.yRatio * h;
                  const scaleFactor = w / (pageData.container.offsetWidth || w);
                  const fontSize = (textItem.fontSize || 24) * scaleFactor;
                  const paddingH = 8 * scaleFactor;
                  const paddingV = 4 * scaleFactor;
                  const textStr = textItem.text || "";

                  ctx.save();
                  let fontStyleStr = "";
                  if (textItem.italic) fontStyleStr += "italic ";
                  if (textItem.bold) fontStyleStr += "bold ";
                  ctx.font = `${fontStyleStr}${fontSize}px sans-serif`;
                  ctx.textBaseline = "middle";

                  const isVertical = textItem.direction === "vertical";

                  if (isVertical) {
                    const charCount = textStr.length;
                    const blockW = fontSize + paddingH * 2;
                    const blockH = charCount * fontSize + paddingV * 2;
                    const startX = tx - blockW / 2;
                    const startY = ty - blockH / 2;

                    // 背景色
                    if (textItem.bg && textItem.bg !== "transparent") {
                      ctx.fillStyle = textItem.bg;
                      ctx.fillRect(startX, startY, blockW, blockH);
                    }

                    // 邊框
                    if (textItem.borderStyle && textItem.borderStyle !== "none") {
                      ctx.strokeStyle = textItem.stroke || "#1e293b";
                      ctx.lineWidth = (textItem.borderWidth || 1) * scaleFactor;
                      if (textItem.borderStyle === "dashed") ctx.setLineDash([ctx.lineWidth * 3, ctx.lineWidth * 2]);
                      else if (textItem.borderStyle === "dotted") ctx.setLineDash([ctx.lineWidth, ctx.lineWidth * 1.5]);
                      else ctx.setLineDash([]);
                      ctx.strokeRect(startX, startY, blockW, blockH);
                    }

                    // 逐字繪製垂直文字
                    ctx.fillStyle = textItem.stroke || "#1e293b";
                    ctx.textAlign = "center";
                    for (let c = 0; c < charCount; c++) {
                      ctx.fillText(textStr[c], startX + blockW / 2, startY + paddingV + (c + 0.5) * fontSize);
                    }
                  } else {
                    const textMetrics = ctx.measureText(textStr);
                    const textW = textMetrics.width;
                    const blockW = textW + paddingH * 2;
                    const blockH = fontSize * 1.2 + paddingV * 2;
                    const startX = tx - blockW / 2;
                    const startY = ty - blockH / 2;

                    // 背景色
                    if (textItem.bg && textItem.bg !== "transparent") {
                      ctx.fillStyle = textItem.bg;
                      ctx.fillRect(startX, startY, blockW, blockH);
                    }

                    // 邊框
                    if (textItem.borderStyle && textItem.borderStyle !== "none") {
                      ctx.strokeStyle = textItem.stroke || "#1e293b";
                      ctx.lineWidth = (textItem.borderWidth || 1) * scaleFactor;
                      if (textItem.borderStyle === "dashed") ctx.setLineDash([ctx.lineWidth * 3, ctx.lineWidth * 2]);
                      else if (textItem.borderStyle === "dotted") ctx.setLineDash([ctx.lineWidth, ctx.lineWidth * 1.5]);
                      else ctx.setLineDash([]);
                      ctx.strokeRect(startX, startY, blockW, blockH);
                    }

                    // 水平文字
                    ctx.fillStyle = textItem.stroke || "#1e293b";
                    let drawX = startX + paddingH;
                    if (textItem.align === "center") {
                      ctx.textAlign = "center";
                      drawX = startX + blockW / 2;
                    } else if (textItem.align === "right") {
                      ctx.textAlign = "right";
                      drawX = startX + blockW - paddingH;
                    } else {
                      ctx.textAlign = "left";
                    }
                    ctx.fillText(textStr, drawX, ty);

                    // 底線
                    if (textItem.underline) {
                      ctx.lineWidth = Math.max(1, fontSize / 14);
                      ctx.strokeStyle = textItem.stroke || "#1e293b";
                      ctx.beginPath();
                      ctx.moveTo(startX + paddingH, ty + fontSize * 0.55);
                      ctx.lineTo(startX + blockW - paddingH, ty + fontSize * 0.55);
                      ctx.stroke();
                    }
                  }
                  ctx.restore();
                });

                // 將合成後的影像填入 jsPDF
                const imgData = mergeCanvas.toDataURL("image/jpeg", 0.95);
                const orientation = w > h ? "landscape" : "portrait";

                if (idx === 0) {
                  pdfDoc = new jsPDF({
                    orientation: orientation,
                    unit: "pt",
                    format: [w, h],
                  });
                } else {
                  pdfDoc.addPage([w, h], orientation);
                }
                pdfDoc.addImage(imgData, "JPEG", 0, 0, w, h);
              }

              // 取得建議檔名 (優先採用 PDF 原檔名，其次使用影片名稱)
              let baseName = "sheet_music";
              if (window.currentPdfName) {
                baseName = window.currentPdfName.replace(/\.[^/.]+$/, "");
              } else if (window.currentVideoName) {
                baseName = window.currentVideoName.replace(/\.[^/.]+$/, "");
              }
              const defaultExportName = baseName + "_annotated.pdf";

              // 轉為 Blob 準備寫入
              const pdfBlob = pdfDoc.output("blob");

              // 檢查瀏覽器是否支援 showSaveFilePicker 另存新檔視窗
              if ("showSaveFilePicker" in win) {
                try {
                  const savePickerOptions = {
                    suggestedName: defaultExportName,
                    types: [
                      {
                        description: "PDF 文件 (*.pdf)",
                        accept: { "application/pdf": [".pdf"] },
                      },
                    ],
                  };
                  // 若有原始 PDF handle，嘗試帶入同一路徑
                  if (window.currentPdfHandle) {
                    savePickerOptions.startIn = window.currentPdfHandle;
                  }

                  const handle = await win.showSaveFilePicker(savePickerOptions);
                  window.currentPdfHandle = handle;
                  const writable = await handle.createWritable();
                  await writable.write(pdfBlob);
                  await writable.close();
                } catch (err) {
                  if (err.name !== "AbortError") {
                    console.warn("showSaveFilePicker 失敗，改用傳統下載:", err);
                    pdfDoc.save(defaultExportName);
                  }
                }
              } else {
                pdfDoc.save(defaultExportName);
              }
            } catch (err) {
              console.error("匯出 PDF 失敗:", err);
              win.alert("匯出 PDF 時發生錯誤，請檢視控制台。");
            } finally {
              exportPdfBtn.textContent = originalBtnText;
              exportPdfBtn.disabled = false;
            }
          };
        }

        win.loadPdfInWindowGlobally = async (data) => loadPdfInWindow(win, data);

        async function loadPdfInWindow(w, data) {
          const d = w.document;
          d.getElementById("pdf-placeholder").style.display = "none";

          const oldPages = scaleWrapper.querySelectorAll(".page-container");
          oldPages.forEach((p) => p.remove());
          w.pdfPagesRendered = [];

          try {
            const loadingTask = w.pdfjsLib.getDocument(data);
            currentPdfDoc = await loadingTask.promise;

            for (let i = 1; i <= currentPdfDoc.numPages; i++) {
              const page = await currentPdfDoc.getPage(i);
              const isMobileOrTablet =
                /iPad|iPhone|iPod|Android/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
              const renderScale = isMobileOrTablet ? 1.2 : 2.0;

              const viewport = page.getViewport({ scale: renderScale });

              const pageContainer = d.createElement("div");
              pageContainer.className = "page-container";
              pageContainer.style.width = viewport.width + "px";
              pageContainer.style.height = viewport.height + "px";
              pageContainer.dataset.pageNum = i;

              const canvas = d.createElement("canvas");
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              canvas.style.width = "100%";
              canvas.style.height = "100%";
              canvas.style.display = "block";
              pageContainer.appendChild(canvas);

              // 錨點層 (z-10)
              const anchorContainer = d.createElement("div");
              anchorContainer.style.position = "absolute";
              anchorContainer.style.inset = "0";
              anchorContainer.style.pointerEvents = "none";
              anchorContainer.style.zIndex = "10";
              pageContainer.appendChild(anchorContainer);

              // 方框層 (z-15)
              const boxContainer = d.createElement("div");
              boxContainer.style.position = "absolute";
              boxContainer.style.inset = "0";
              boxContainer.style.pointerEvents = "none";
              boxContainer.style.zIndex = "15";
              pageContainer.appendChild(boxContainer);

              // 文字註解層 (z-20)
              const textContainer = d.createElement("div");
              textContainer.style.position = "absolute";
              textContainer.style.inset = "0";
              textContainer.style.pointerEvents = "none";
              textContainer.style.zIndex = "20";
              pageContainer.appendChild(textContainer);

              pageContainer.addEventListener("dragover", (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "copy";
              });

              pageContainer.addEventListener("drop", (e) => {
                e.preventDefault();
                const regionName = e.dataTransfer.getData("text/plain");
                if (!regionName) return;

                const rect = pageContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const xRatio = x / rect.width;
                const yRatio = y / rect.height;

                const existingIdx = pdfAnchors.findIndex((a) => a.regionName === regionName);
                if (existingIdx >= 0) {
                  pdfAnchors[existingIdx] = { regionName, pageNum: i, xRatio, yRatio };
                } else {
                  pdfAnchors.push({ regionName, pageNum: i, xRatio, yRatio });
                }

                window.renderPdfAnchorsInWindow(w);
                window.updateSheetWindowUI();
              });

              scaleWrapper.appendChild(pageContainer);
              w.pdfPagesRendered.push({
                container: pageContainer,
                anchorContainer,
                boxContainer,
                textContainer,
                viewport,
              });

              const renderContext = {
                canvasContext: canvas.getContext("2d"),
                viewport: viewport,
              };
              await page.render(renderContext).promise;
            }

            window.renderPdfAnchorsInWindow(w);
            window.renderPdfTextAnnotations(w);
            window.renderPdfBoxAnnotations(w);

            const zoomFitBtn = d.getElementById("zoom-fit-btn");
            if (zoomFitBtn) zoomFitBtn.click();
          } catch (error) {
            console.error("Error rendering PDF:", error);
          }
        }

        // 點擊新增文字
        pdfViewerContainer.addEventListener("click", (e) => {
          if (!isTextMode) return;
          if (e.target && (e.target.closest(".sheet-text-item") || e.target.closest(".sheet-box-item") || e.target.closest(".anchor-mark") || e.target.closest(".floating-panel") || e.target.closest("#text-tool-btn") || e.target.closest("#box-tool-btn"))) {

          if (!targetPage) return;

          e.preventDefault();
