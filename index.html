        playPauseOverlay.firstElementChild.classList.remove("scale-150");
        playPauseOverlay.firstElementChild.classList.add("scale-100");

        clearTimeout(playPauseTimer);
        playPauseTimer = setTimeout(() => {
          playPauseOverlay.classList.add("opacity-0");
          playPauseOverlay.firstElementChild.classList.remove("scale-100");
          playPauseOverlay.firstElementChild.classList.add("scale-150");
        }, 500);
      });

      // 應用程式狀態
      let duration = 0;
      let clips = []; // { id, start, end, selected }
      let currentMode = "A"; // 'A' (Select) or 'B' (Split)
      let loopRegion = null; // { start, end }
      let isDragging = false;
      let dragStartX = 0;
      let isHoverPreview = true; // 預覽開關
      let activeDragClip = null; // 目前拖曳中的片段
      let dragOffset = 0; // 拖曳點與片段開頭的距離
      let speedToastTimer = null; // 速度提示計時器
      let clickSelectStart = null; // 兩點選取起點

      let pdfAnchors = []; // 儲存樂譜錨點資訊

      // 歷史紀錄狀態 (Undo/Redo)
      let history = [];
      let historyIndex = -1;

      // 音訊波形狀態
      let waveformPeaks = [];

      // 獨立播放頭狀態
      let savedPlayTime = 0;
      let isHoveringTimeline = false;

      function saveState() {
        if (historyIndex < history.length - 1) {
          history = history.slice(0, historyIndex + 1);
        }
        history.push({
          clips: JSON.parse(JSON.stringify(clips)),
          regions:
            typeof customRegions !== "undefined"
              ? JSON.parse(JSON.stringify(customRegions))
              : [],
          pdfTextAnnotations: JSON.parse(JSON.stringify(pdfTextAnnotations || [])),
          pdfBoxAnnotations: JSON.parse(JSON.stringify(pdfBoxAnnotations || [])),
        });
        historyIndex++;
      }

      function undo() {
        if (historyIndex > 0) {
          historyIndex--;
          const state = history[historyIndex];
          clips = JSON.parse(JSON.stringify(state.clips || state));
          if (typeof customRegions !== "undefined" && state.regions) {
            customRegions = JSON.parse(JSON.stringify(state.regions));
            renderRegions();
          }
          if (state.pdfTextAnnotations) {
            pdfTextAnnotations = JSON.parse(JSON.stringify(state.pdfTextAnnotations));
          }
          if (state.pdfBoxAnnotations) {
            pdfBoxAnnotations = JSON.parse(JSON.stringify(state.pdfBoxAnnotations));
          }
          if (sheetWindow && !sheetWindow.closed) {
            if (typeof window.renderPdfTextAnnotations === "function") window.renderPdfTextAnnotations(sheetWindow);
            if (typeof window.renderPdfBoxAnnotations === "function") window.renderPdfBoxAnnotations(sheetWindow);
          }
          renderTimeline();
        }
      }

      function redo() {
        if (historyIndex < history.length - 1) {
          historyIndex++;
          const state = history[historyIndex];
          clips = JSON.parse(JSON.stringify(state.clips || state));
          if (typeof customRegions !== "undefined" && state.regions) {
            customRegions = JSON.parse(JSON.stringify(state.regions));
            renderRegions();
          }
          if (state.pdfTextAnnotations) {
            pdfTextAnnotations = JSON.parse(JSON.stringify(state.pdfTextAnnotations));
          }
          if (state.pdfBoxAnnotations) {
            pdfBoxAnnotations = JSON.parse(JSON.stringify(state.pdfBoxAnnotations));
          }
          if (sheetWindow && !sheetWindow.closed) {
            if (typeof window.renderPdfTextAnnotations === "function") window.renderPdfTextAnnotations(sheetWindow);
            if (typeof window.renderPdfBoxAnnotations === "function") window.renderPdfBoxAnnotations(sheetWindow);
          }
          renderTimeline();
        }
      }

      if (undoBtn) undoBtn.addEventListener("click", undo);
      if (redoBtn) redoBtn.addEventListener("click", redo);

      // 預覽開關事件
      const eyeIcon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;
      const eyeSlashIcon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>`;

      if (previewToggle) {
        previewToggle.innerHTML = isHoverPreview ? eyeIcon : eyeSlashIcon;
        previewToggle.addEventListener("click", () => {
          isHoverPreview = !isHoverPreview;
          previewToggle.innerHTML = isHoverPreview ? eyeIcon : eyeSlashIcon;
          previewToggle.className = isHoverPreview
            ? "p-2 rounded-lg bg-green-600 text-white transition-all"
            : "p-2 rounded-lg bg-gray-600 text-gray-400 transition-all";
        });
      }

      // 解析音訊波形函數
      async function extractAudioWaveform(file) {
        waveformPeaks = [];
        const isIOS =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIOS) {
          try {
            // 動態載入 FFmpeg.wasm (若尚未載入)
            if (!window.FFmpeg) {
              await new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src =
                  "https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js";
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
              });
            }

            const { createFFmpeg, fetchFile } = FFmpeg;
            // 初始化 FFmpeg
            const ffmpeg = createFFmpeg({
              log: false,
              corePath:
                "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js",
            });
            await ffmpeg.load();

            // 將檔案寫入虛擬檔案系統
            ffmpeg.FS("writeFile", "input.mp4", await fetchFile(file));

            // 執行指令：提取音軌、單聲道、降取樣率為 8000Hz、轉為 mp3
            await ffmpeg.run(
              "-i",
              "input.mp4",
              "-vn",
              "-ac",
              "1",
              "-ar",
              "8000",
              "-b:a",
              "32k",
              "output.mp3",
            );

            // 讀取處理完的輕量音訊檔
            const data = ffmpeg.FS("readFile", "output.mp3");

            // 清理虛擬記憶體
            ffmpeg.FS("unlink", "input.mp4");
            ffmpeg.FS("unlink", "output.mp3");

            // 使用原生的 AudioContext 解碼輕量化的 mp3
            const audioCtx = new (
              window.AudioContext || window.webkitAudioContext
            )();
            const audioBuffer = await audioCtx.decodeAudioData(data.buffer);
            const channelData = audioBuffer.getChannelData(0);

            const samples = 15000;
            const step = Math.ceil(channelData.length / samples);
            for (let i = 0; i < samples; i++) {
              let max = 0;
              for (let j = 0; j < step; j++) {
                if (i * step + j >= channelData.length) break;
                const val = Math.abs(channelData[i * step + j]);
                if (val > max) max = val;
              }
              waveformPeaks.push(max);
            }
            if (duration) renderTimeline();
          } catch (err) {
            console.warn("iPad FFmpeg 解析波形失敗 (可能遇到跨域限制):", err);
          }
        } else {
          // 原本的桌面版 / Android 處理邏輯
          const audioCtx = new (
            window.AudioContext || window.webkitAudioContext
          )();
          const reader = new FileReader();
          reader.onload = function (e) {
            audioCtx
              .decodeAudioData(e.target.result, function (buffer) {
                const channelData = buffer.getChannelData(0);
                // 將取樣數提高到 15000，確保極度放大時仍有高解析度細節
                const samples = 15000;
                const step = Math.ceil(channelData.length / samples);
                for (let i = 0; i < samples; i++) {
                  let max = 0;
                  for (let j = 0; j < step; j++) {
                    if (i * step + j >= channelData.length) break;
                    const val = Math.abs(channelData[i * step + j]);
                    if (val > max) max = val;
                  }
                  waveformPeaks.push(max);
                }
                if (duration) renderTimeline(); // 重新渲染以顯示波形
              })
              .catch((err) =>
                console.warn("音訊解析失敗 (可能檔案過大或格式不支援):", err),
              );
          };
          reader.readAsArrayBuffer(file);
        }
      }

      let currentVideoName = "";
      let currentPdfName = "sheet_music.pdf";
      let currentPdfHandle = null;
      let pendingImportData = null;

      // 載入影片
      upload.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        currentVideoName = file.name;
        const url = URL.createObjectURL(file);
        video.src = url;
        video.load();
        extractAudioWaveform(file);
      });

      // 支援滑鼠拖曳載入多種檔案 (影片、JSON、PDF)
      document.body.addEventListener("dragover", (e) => {
        e.preventDefault(); // 必須阻止預設行為，否則瀏覽器會直接開啟影片離開網頁
      });

      document.body.addEventListener("drop", async (e) => {
        e.preventDefault();
        const files = Array.from(e.dataTransfer.files);
        if (files.length === 0) return;

        let videoFile = null;
        let jsonFile = null;
        let pdfFile = null;

        files.forEach((file) => {
          if (file.type.startsWith("video/")) videoFile = file;
          else if (
            file.name.endsWith(".json") ||
            file.type === "application/json"
          )
            jsonFile = file;
          else if (
            file.name.endsWith(".pdf") ||
            file.type === "application/pdf"
          )
            pdfFile = file;
        });

        // 1. 處理 JSON (先讀取，確保 pendingImportData 準備好)
        if (jsonFile) {
          await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (event) => {
              const data = JSON.parse(event.target.result);
              customRegions = data.customRegions || [];
              pdfAnchors = data.pdfAnchors || [];
              pdfTextAnnotations = data.pdfTextAnnotations || [];
              pdfBoxAnnotations = data.pdfBoxAnnotations || [];
              document
                .getElementById("sheet-music-btn")
                .classList.remove("hidden");
              renderRegions();
              if (typeof window.updateSheetWindowUI === "function")
                window.updateSheetWindowUI();
              if (sheetWindow && !sheetWindow.closed) {
                if (typeof window.renderPdfTextAnnotations === "function") window.renderPdfTextAnnotations(sheetWindow);
                if (typeof window.renderPdfBoxAnnotations === "function") window.renderPdfBoxAnnotations(sheetWindow);
              }

              if (data.videoName) {
                currentVideoName = data.videoName;
                pendingImportData = data;
                // 若沒有一起拉入影片，才提醒選擇影片
                if (!videoFile) {
                  setTimeout(() => {
                    alert(
                      `請選擇對應的影片檔 / Please select the corresponding video file:\n\n👉 ${data.videoName}`,
                    );
                    document.getElementById("video-upload").click();
                  }, 50);
                }
              } else {
                clips = data.clips;
                saveState();
                renderTimeline();
              }
              resolve();
            };
            reader.readAsText(jsonFile);
          });
        }

        // 2. 處理影片 (載入後自動觸發 loadedmetadata 讀取上面的 pendingImportData)
        if (videoFile) {
          currentVideoName = videoFile.name;
          const url = URL.createObjectURL(videoFile);
          video.src = url;
          video.load();
          extractAudioWaveform(videoFile);
        }

        // 3. 處理 PDF 樂譜 (開啟視窗並傳入資料)
        if (pdfFile) {
          const pdfReader = new FileReader();
          pdfReader.onload = function () {
            const typedarray = new Uint8Array(this.result);
            window.pendingPdfBuffer = typedarray; // 暫存於全域供子視窗抓取

            // 觸發開啟樂譜視窗
            document.getElementById("sheet-music-btn").click();

            // 輪詢等待子視窗就緒後，直接自動載入 PDF
            const checkInterval = setInterval(() => {
              if (
                sheetWindow &&
                !sheetWindow.closed &&
                sheetWindow.loadPdfInWindowGlobally
              ) {
                clearInterval(checkInterval);
                sheetWindow.loadPdfInWindowGlobally(window.pendingPdfBuffer);
                window.pendingPdfBuffer = null;
              }
            }, 200);
          };
          pdfReader.readAsArrayBuffer(pdfFile);
        }
      });

      // 影片載入完成初始化資料
      video.addEventListener("loadedmetadata", () => {
        const initVideoData = () => {
          duration = video.duration;

          if (pendingImportData) {
            clips = pendingImportData.clips;
            loopRegion = null;
            pendingImportData = null;
          } else {
            // 真正的 NLE 架構：區分時間軸時間 (start/end) 與原始影片時間 (sourceStart)
            clips = [
              {
                id: Date.now(),
                start: 0,
                end: duration,
                sourceStart: 0,
                selected: false,
                track: 0,
              },
            ];
            loopRegion = null;
          }
          modeIndicator.classList.remove("hidden");
          document.getElementById("sheet-music-btn").classList.remove("hidden");

          history = [];
          historyIndex = -1;
          saveState(); // 儲存初始狀態

          setMode("A");
          renderTimeline();

          // 啟動虛擬播放引擎
          if (!animFrameId)
            animFrameId = requestAnimationFrame(virtualPlayEngine);
        };

        let animFrameId = null;
        let lastSysTime = performance.now();
        let currentActiveClip = null;

        // 虛擬播放引擎：負責讓時間軸與各個散落的片段對齊播放
        function virtualPlayEngine(sysTime) {
          const delta = (sysTime - lastSysTime) / 1000;
          lastSysTime = sysTime;

          if (!video.paused) {
            // 尋找當前時間點所在的片段 (高軌道優先)
            let activeClip = null;
            for (let c of clips) {
              if (savedPlayTime >= c.start && savedPlayTime < c.end) {
                if (!activeClip || c.track > activeClip.track) activeClip = c;
              }
            }

            if (activeClip) {
              const targetSourceTime =
                (activeClip.sourceStart || 0) +
                (savedPlayTime - activeClip.start);

              // 【核心修復】解決 iPad 卡頓的靈魂邏輯
              // 如果誤差大於 0.5 秒 (例如剛跳轉、跨片段)，才強制改變影片 currentTime
              if (Math.abs(video.currentTime - targetSourceTime) > 0.5) {
                video.currentTime = targetSourceTime;
              } else {
                // 正常播放中：反轉主從關係！
                // 讓影片的「硬體真實播放進度」去推動「全局虛擬時間」
                // 這樣 iPad 就不會因為微小的掉幀或緩衝，一直被迫執行卡頓的 Seek 操作
                savedPlayTime =
                  activeClip.start +
                  (video.currentTime - (activeClip.sourceStart || 0));
              }

              video.style.opacity = "1";
              video.muted = false;
              currentActiveClip = activeClip;
            } else {
              // 播放到空白區段，此時沒有影片實體可依賴，改用系統時間往前走
              savedPlayTime += delta * video.playbackRate;
              video.style.opacity = "0";
              video.muted = true;
              currentActiveClip = null;
            }

            // 循環播放處理
            if (loopRegion && loopRegion.start !== loopRegion.end) {
              if (savedPlayTime >= loopRegion.end) {
                savedPlayTime = loopRegion.start;
                // 強制將影片跳回循環起點，避免延遲
                for (let c of clips) {
                  if (savedPlayTime >= c.start && savedPlayTime < c.end) {
                    video.currentTime =
                      (c.sourceStart || 0) + (savedPlayTime - c.start);
                    break;
                  }
                }
              }
            }

            // 到底強制暫停
            if (savedPlayTime >= duration) {
              savedPlayTime = duration;
              video.pause();
            }
          }

          // 更新 UI 播放頭 (無論是否播放皆強制同步)
          const maxTime = Math.max(duration, ...clips.map((c) => c.end));
          const percent = maxTime > 0 ? (savedPlayTime / maxTime) * 100 : 0;
          playhead.style.left = `${percent}%`;

          animFrameId = requestAnimationFrame(virtualPlayEngine);
        }

        // 修正 Chrome 瀏覽器載入本地影片時 duration 為 Infinity 導致進度條消失的 Bug
        if (video.duration === Infinity || isNaN(video.duration)) {
          video.currentTime = 1e101; // 強制跳到影片最後以取得正確長度
          const fixDuration = () => {
            video.removeEventListener("timeupdate", fixDuration);
            video.currentTime = 0;
            initVideoData();
          };
          video.addEventListener("timeupdate", fixDuration);
        } else {
          initVideoData();
        }
      });

      // 移除原生 timeupdate 的時間軸強制連動，完全由虛擬播放引擎 (virtualPlayEngine) 接管
      // 新增平板背景執行防護：當主頁在背景時 requestAnimationFrame 會暫停，改由 timeupdate 接手維持循環播放
      video.addEventListener("timeupdate", () => {
        if (!duration) return;

        if (loopRegion && loopRegion.start !== loopRegion.end) {
          // 透過當前影片真實硬體時間，反推全局虛擬時間
          let currentVirtualTime = savedPlayTime;
          for (let c of clips) {
            const sStart = c.sourceStart || 0;
            if (
              video.currentTime >= sStart &&
              video.currentTime <= sStart + (c.end - c.start)
            ) {
              currentVirtualTime = c.start + (video.currentTime - sStart);
              break;
            }
          }

          // 精準防禦：只要虛擬時間一超過結束點，不論是否切換視窗，立刻強制同步並跳回
          if (currentVirtualTime >= loopRegion.end || video.currentTime >= video.duration) {
            savedPlayTime = loopRegion.start;
            let targetSourceTime = loopRegion.start;
            for (let c of clips) {
              if (loopRegion.start >= c.start && loopRegion.start < c.end) {
                targetSourceTime =
                  (c.sourceStart || 0) + (loopRegion.start - c.start);
                break;
              }
            }
            video.currentTime = targetSourceTime;
          } else if (!video.paused) {
            // 如果在正常播放中且未到底，由影片進度持續強刷虛擬時間，防止切換視窗時間凍結
            savedPlayTime = currentVirtualTime;
          }
        }
      });

      // 播放速度調整
      speedSlider.addEventListener("input", (e) => {
        const speed = parseFloat(e.target.value);
        video.playbackRate = speed;
        speedDisplay.textContent = speed.toFixed(1) + "x";
      });

      // --- 時間軸互動與渲染 ---

      function renderTimeline() {
        if (!duration) return;
        const maxTime = Math.max(duration, ...clips.map((c) => c.end));

        // 重建軌道 DOM
        clipsTrack.innerHTML = `
                <div id="track-0" class="flex-1 relative pointer-events-none"></div>
            `;
        const track0 = document.getElementById("track-0");
        const track1 = null;

        clips.forEach((clip) => {
          const clipEl = document.createElement("div");
          const leftPercent = (clip.start / maxTime) * 100;
          const widthPercent = ((clip.end - clip.start) / maxTime) * 100;

          const colorClass =
            clip.track === 1
              ? "bg-indigo-600/80 border-indigo-800"
              : "bg-blue-600/80 border-blue-800";
          clipEl.className = `clip-segment absolute top-0 bottom-0 ${colorClass} rounded border-y border-x-2 border-x-gray-900 pointer-events-auto cursor-pointer ${clip.selected ? "selected" : ""}`;

          clipEl.style.left = `calc(${leftPercent}% + 1px)`;
          clipEl.style.width = `calc(${widthPercent}% - 2px)`;

          clipEl.addEventListener("mousedown", (e) => {
            e.stopPropagation();
            // 點擊片段時取消自定義區塊的高亮狀態
            activeRegionIndex = -1;
            renderRegions();

            // 手動偵測雙擊，解決 renderTimeline 重構 DOM 導致原生 dblclick 失效的問題
            const now = Date.now();
            const isDoubleClick = now - (clip.lastClick || 0) < 300;
            clip.lastClick = now;

            const contentEl = document.getElementById("timeline-content");
            const rect = contentEl.getBoundingClientRect();
            const clickTime = ((e.clientX - rect.left) / rect.width) * maxTime;

            savedPlayTime = clickTime;
            const targetSourceTime =
              (clip.sourceStart || 0) + (clickTime - clip.start);
            video.currentTime = targetSourceTime;

            // 處理雙擊框選、Shift 兩點框選或重設。現在支援在藍色片段上進行 Shift+點擊 框選
            if (isDoubleClick) {
              loopRegion = { start: clip.start, end: clip.end };
              clickSelectStart = null;

              // 使用 setTimeout 讓畫面先渲染出綠色選取框，再跳出輸入視窗
              setTimeout(() => {
                const name = prompt(
                  i18nData[currentLang].promptRegion,
                  i18nData[currentLang].promptRegionDefault +
                    (customRegions.length + 1),
                );
                if (name) {
                  customRegions.push({
                    name,
                    start: loopRegion.start,
                    end: loopRegion.end,
                  });
                  saveState();
                  renderRegions();
                  renderTimeline();
                }
              }, 50);
            } else if (e.shiftKey && clickSelectStart !== null) {
              loopRegion = {
                start: Math.min(clickSelectStart, clickTime),
                end: Math.max(clickSelectStart, clickTime),
              };
              clickSelectStart = null;
            } else {
              loopRegion = null;
              clickSelectStart = clickTime;
            }

            if (currentMode === "A") {
              if (!e.shiftKey) clips.forEach((c) => (c.selected = false));
              clip.selected = true;
              activeDragClip = clip;
              dragOffset = clickTime - clip.start;
              renderTimeline();
            } else if (currentMode === "B") {
              splitClip(clip, clickTime);
            }
          });

          // 繪製音訊波形
          if (waveformPeaks.length > 0 && duration > 0) {
            const canvas = document.createElement("canvas");
            // 改善：將 bottom-8 改為 bottom-1 並拉高比例，確保波形貼齊底部不被空白處遮擋
            canvas.className =
              "absolute inset-x-0 bottom-1 w-full h-3/4 pointer-events-none";
            const clipRatio = (clip.end - clip.start) / duration;

            const containerWidth =
              document.getElementById("timeline-container").clientWidth;
            const currentZoom =
              parseFloat(document.getElementById("zoom-slider").value) || 1;
            const expectedPixelWidth = containerWidth * currentZoom * clipRatio;
            canvas.width = Math.min(
              16000,
              Math.max(100, Math.floor(expectedPixelWidth)),
            );
            canvas.height = 80;
            const ctx = canvas.getContext("2d");

            const startIdx = Math.floor(
              (clip.sourceStart / duration) * waveformPeaks.length,
            );
            const endIdx = Math.floor(
              ((clip.sourceStart + (clip.end - clip.start)) / duration) *
                waveformPeaks.length,
            );
            const clipPeaks = waveformPeaks.slice(startIdx, endIdx);

            if (clipPeaks.length > 0) {
              const barWidth = canvas.width / clipPeaks.length;
              clipPeaks.forEach((peak, i) => {
                const displayPeak = Math.min(peak * 1.5, 1.0);
                const h = displayPeak * canvas.height;
                if (displayPeak > 0.7) {
                  const gradient = ctx.createLinearGradient(
                    0,
                    canvas.height - h,
                    0,
                    canvas.height,
                  );
                  gradient.addColorStop(0, "#FF3B30");
                  gradient.addColorStop(0.2, "#FF9500");
                  gradient.addColorStop(0.5, "#38BDF8");
                  ctx.fillStyle = gradient;
                } else {
                  ctx.fillStyle = "#38BDF8";
                }
                ctx.fillRect(
                  i * barWidth,
                  canvas.height - h,
                  Math.max(1, barWidth - 0.5),
                  h,
                );
              });
            }
            clipEl.appendChild(canvas);
          }

          // 2) 在藍色影片區塊上方，用半透明的文字顯示用戶標示的名稱
          const matchedRegion = customRegions.find(
            (r) =>
              Math.abs(r.start - clip.start) < 0.1 &&
              Math.abs(r.end - clip.end) < 0.1,
          );
          if (matchedRegion) {
            const label = document.createElement("div");
            label.className =
              "absolute top-1 left-2 text-white/40 font-bold text-[10px] pointer-events-none select-none truncate pr-2";
            label.textContent = matchedRegion.name;
            clipEl.appendChild(label);
          }

          if (track0) {
            track0.appendChild(clipEl);
          }
        });

        if (loopRegion) {
          loopRegionEl.classList.remove("hidden");
          const startP = (loopRegion.start / maxTime) * 100;
          const widthP = ((loopRegion.end - loopRegion.start) / maxTime) * 100;
          loopRegionEl.style.left = `${startP}%`;
          loopRegionEl.style.width = `${widthP}%`;
        } else {
          loopRegionEl.classList.add("hidden");
        }

        // 2) 當多個片段被選取時，顯示合併按鈕
        const mergeBtn = document.getElementById("merge-clips-btn");
        if (mergeBtn) {
          const selectedCount = clips.filter((c) => c.selected).length;
          if (selectedCount > 1) {
            mergeBtn.classList.remove("hidden");
          } else {
            mergeBtn.classList.add("hidden");
          }
        }
      }

      function splitClip(clip, time) {
        // 確保分割點在片段內部
        if (time <= clip.start + 0.1 || time >= clip.end - 0.1) return;
        const idx = clips.indexOf(clip);
        if (idx === -1) return;

        // 繼承軌道屬性與計算原始影片對應時間 (True NLE)
        const tIdx = clip.track || 0;
        const sStart = clip.sourceStart || 0;
        const splitOffset = time - clip.start;

        const clip1 = {
          id: Date.now(),
          start: clip.start,
          end: time,
          sourceStart: sStart,
          selected: clip.selected,
          track: tIdx,
        };
        const clip2 = {
          id: Date.now() + 1,
          start: time,
          end: clip.end,
          sourceStart: sStart + splitOffset,
          selected: false,
          track: tIdx,
        };

        clips.splice(idx, 1, clip1, clip2);
        saveState(); // 紀錄分割
        renderTimeline();

        // 成功分割後自動跳回 A 模式
        setMode("A");
      }

      // 點擊背景：B模式背景切割 或 A模式兩點框選
      timelineBg.addEventListener("mousedown", (e) => {
        if (!duration) return;
        // 點擊背景時取消自定義區塊的高亮狀態
        activeRegionIndex = -1;
        renderRegions();

        const contentEl = document.getElementById("timeline-content");
        const rect = contentEl.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const maxTime = Math.max(duration, ...clips.map((c) => c.end));
        const time = (clickX / rect.width) * maxTime;

        // 點擊任一地方皆更新紅色進度線 (包含 B 模式)
        savedPlayTime = time;
        let targetSourceTime = time;
        video.style.opacity = "0";
        video.muted = true;
        for (let c of clips) {
          if (time >= c.start && time < c.end) {
            targetSourceTime = (c.sourceStart || 0) + (time - c.start);
            video.style.opacity = "1";
            video.muted = false;
            break;
          }
        }
        video.currentTime = targetSourceTime;

        if (currentMode === "B") {
          // 在背景按 B 也能切割：找出該時間點覆蓋的片段
          let splitted = false;
          const targets = clips.filter(
            (c) => time > c.start + 0.1 && time < c.end - 0.1,
          );
          targets.forEach((c) => {
            splitClip(c, time);
            splitted = true;
          });
          return;
        }

        // A 模式：兩點選取 (按住 Shift 點擊第二點才框選)
        if (currentMode === "A") {
          if (e.shiftKey && clickSelectStart !== null) {
            loopRegion = {
              start: Math.min(clickSelectStart, time),
              end: Math.max(clickSelectStart, time),
            };
            // 1) 在灰色區域 Shift+點擊時，同時選取該範圍內的所有片段
            clips.forEach((c) => {
              if (c.start < loopRegion.end && c.end > loopRegion.start) {
                c.selected = true;
              }
            });
            clickSelectStart = null;
          } else {
            clickSelectStart = time;
            loopRegion = null;
          }
          renderTimeline();
        }
      });

      document.addEventListener("mousemove", (e) => {
        if (!duration) return;
        const containerRect = timelineContainer.getBoundingClientRect();
        const contentEl = document.getElementById("timeline-content");
        const contentRect = contentEl.getBoundingClientRect();

        const inTimeline =
          e.clientY >= containerRect.top &&
          e.clientY <= containerRect.bottom &&
          e.clientX >= containerRect.left &&
          e.clientX <= containerRect.right;

        // 處理獨立游標預覽線與滑動預覽
        if (inTimeline) {
          let hoverX = e.clientX - contentRect.left;
          hoverX = Math.max(0, Math.min(hoverX, contentRect.width));
          const hoverTime = (hoverX / contentRect.width) * duration;

          if (
            isHoverPreview &&
            !isDragging &&
            !activeDragClip &&
            video.paused
          ) {
            isHoveringTimeline = true;
            let targetSourceTime = hoverTime;
            video.style.opacity = "0";
            for (let c of clips) {
              if (hoverTime >= c.start && hoverTime < c.end) {
                targetSourceTime = (c.sourceStart || 0) + (hoverTime - c.start);
                video.style.opacity = "1";
                break;
              }
            }
            video.currentTime = targetSourceTime;
          }
          hoverLine.style.left = `${(hoverX / contentRect.width) * 100}%`;
          hoverLine.classList.remove("hidden");
        } else {
          if (isHoveringTimeline && video.paused) {
            video.currentTime = savedPlayTime; // 滑鼠離開時間軸時恢復畫面
          }
          isHoveringTimeline = false;
          hoverLine.classList.add("hidden");
        }

        let currentX = e.clientX - contentRect.left;
        currentX = Math.max(0, Math.min(currentX, contentRect.width)); // 限制在容器內
        const currentTimePos = (currentX / contentRect.width) * duration;

        // 處理片段拖曳 (拉開與切換軌道，防重疊)
        if (activeDragClip && currentMode === "A") {
          const clipLen = activeDragClip.end - activeDragClip.start;
          let newStart = currentTimePos - dragOffset;

          // 鎖定單一軌道
          const newTrack = 0;

          if (newStart < 0) newStart = 0;
          let newEnd = newStart + clipLen;

          // 防重疊偵測 (Anti-collision): 尋找目標軌道上的其他片段
          let canMove = true;
          for (let other of clips) {
            if (other.id !== activeDragClip.id && other.track === newTrack) {
              if (newStart < other.end && newEnd > other.start) {
                // 發生碰撞，將片段卡在相鄰片段的邊緣
                if (activeDragClip.start >= other.end) {
                  newStart = other.end;
                  newEnd = newStart + clipLen;
                } else if (activeDragClip.end <= other.start) {
                  newEnd = other.start;
                  newStart = newEnd - clipLen;
                } else {
                  canMove = false;
                }
              }
            }
          }

          if (canMove) {
            activeDragClip.start = newStart;
            activeDragClip.end = newEnd;
            activeDragClip.track = newTrack;
          }

          renderTimeline();
          return;
        }

        // 處理背景拖曳 (循環區間)
        if (isDragging) {
          const time1 = (dragStartX / contentRect.width) * duration;
          const time2 = currentTimePos;

          if (Math.abs(currentX - dragStartX) > 5) {
            loopRegion = {
              start: Math.min(time1, time2),
              end: Math.max(time1, time2),
            };
          } else {
            video.currentTime = time2;
            loopRegion = null;
          }
          renderTimeline();
        }
      });

      document.addEventListener("mouseup", () => {
        if (activeDragClip) {
          activeDragClip = null;
          saveState(); // 紀錄拖曳結果
        }
        if (isDragging) {
          isDragging = false;
          if (loopRegion && loopRegion.end - loopRegion.start < 0.2)
            loopRegion = null;
          renderTimeline();
        }
      });

      // --- 快捷鍵設定 ---
      function setMode(mode) {
        currentMode = mode;
        if (mode === "A") {
          currentModeText.textContent = i18nData[currentLang].modeA;
          currentModeText.className = "text-blue-400 font-bold";
          timelineContainer.classList.remove("cursor-col-resize");
          timelineContainer.classList.add("cursor-crosshair");
        } else {
          currentModeText.textContent = i18nData[currentLang].modeB;
          currentModeText.className = "text-red-400 font-bold";
          timelineContainer.classList.remove("cursor-crosshair");
          timelineContainer.classList.add("cursor-col-resize"); // 改用類似刀片的游標提示
        }
      }

      function updateSpeed(speed) {
        speed = Math.max(0.1, Math.min(speed, 4));
        video.playbackRate = speed;
        speedSlider.value = speed;
        speedDisplay.textContent = speed.toFixed(1) + "x";

        // 同步更新速度按鈕的 UI 選取狀態
        const formattedSpeed = speed.toFixed(1);
        document.querySelectorAll(".speed-btn").forEach((btn) => {
          if (btn.dataset.speed === formattedSpeed) {
            btn.className =
              "speed-btn px-3 py-1.5 mx-0.5 rounded-lg text-sm font-bold transition-all border bg-blue-600 border-blue-400 text-white";
          } else {
            btn.className =
              "speed-btn px-3 py-1.5 mx-0.5 rounded-lg text-sm font-bold transition-all border border-gray-600 bg-gray-700 text-gray-300 hover:bg-blue-500 hover:text-white";
          }
        });

        // 顯示畫面的提示 2 秒
        if (speedToast) {
          speedToast.textContent = speed.toFixed(1) + "x";
          speedToast.classList.remove("opacity-0");
          clearTimeout(speedToastTimer);
          speedToastTimer = setTimeout(() => {
            speedToast.classList.add("opacity-0");
          }, 2000);
        }
      }

      document.addEventListener("keydown", (e) => {
        // 避免焦點在 input 時觸發快捷鍵
        if (e.target.tagName.toLowerCase() === "input") return;

        // 處理自定義區塊的左右切換與順序對調
        if (activeRegionIndex !== -1 && customRegions.length > 0) {
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            if (e.metaKey || e.ctrlKey) {
              if (activeRegionIndex > 0) {
                const temp = customRegions[activeRegionIndex];
                customRegions[activeRegionIndex] =
                  customRegions[activeRegionIndex - 1];
                customRegions[activeRegionIndex - 1] = temp;
                activeRegionIndex--;
                saveState();
                renderRegions();
                renderTimeline();
              }
            } else {
              if (activeRegionIndex > 0) {
                activeRegionIndex--;
                const reg = customRegions[activeRegionIndex];
                savedPlayTime = reg.start;
                video.currentTime = reg.start;
                loopRegion = { start: reg.start, end: reg.end };
                renderTimeline();
                renderRegions();
              }
            }
            return;
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            if (e.metaKey || e.ctrlKey) {
              if (activeRegionIndex < customRegions.length - 1) {
                const temp = customRegions[activeRegionIndex];
                customRegions[activeRegionIndex] =
                  customRegions[activeRegionIndex + 1];
                customRegions[activeRegionIndex + 1] = temp;
                activeRegionIndex++;
                saveState();
                renderRegions();
                renderTimeline();
              }
            } else {
              if (activeRegionIndex < customRegions.length - 1) {
                activeRegionIndex++;
                const reg = customRegions[activeRegionIndex];
                savedPlayTime = reg.start;
                video.currentTime = reg.start;
                loopRegion = { start: reg.start, end: reg.end };
                renderTimeline();
                renderRegions();
              }
            }
            return;
          }
        }

        // Undo / Redo 快捷鍵 (Cmd/Ctrl + Z / Y)
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") {
          e.preventDefault();
          undo();
          return;
        }
        if (
          (e.metaKey || e.ctrlKey) &&
          (e.key.toLowerCase() === "y" ||
            (e.shiftKey && e.key.toLowerCase() === "z"))
        ) {
          e.preventDefault();
          redo();
          return;
        }

        // 存檔與載入快捷鍵 (Cmd/Ctrl + S / L)
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          document.getElementById("export-btn").click();
          return;
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "l") {
          e.preventDefault();
          document.getElementById("import-btn").click();
          return;
        }

        const t = video.currentTime;

        switch (e.key.toLowerCase()) {
          case "z":
            if (cropModeBtn) cropModeBtn.click();
            break;
          case "5":
            updateSpeed(0.5);
            break;
          case "8":
            updateSpeed(0.8);
            break;
          case "1":
            updateSpeed(1.0);
            break;
          case "2":
            updateSpeed(2.0);
            break;
          case "3":
            updateSpeed(3.0);
            break;
          case "4":
            updateSpeed(4.0);
            break;
          case "+":
          case "=":
            updateSpeed(video.playbackRate + 0.1);
            break;
          case "-":
          case "_":
            updateSpeed(video.playbackRate - 0.1);
            break;
          case "a":
            setMode("A");
            break;
          case "b":
            setMode("B");
            break;
          case "m":
            activeRegionIndex = -1;
            loopRegion = null;
            clips.forEach((c) => (c.selected = false));
            renderRegions();
            renderTimeline();
            break;
          case "r":
            if (defineRegionBtn) defineRegionBtn.click();
            break;
          case "`":
            const selectedClip = clips.find((c) => c.selected);
            if (selectedClip) {
              loopRegion = { start: selectedClip.start, end: selectedClip.end };
              renderTimeline();
              setTimeout(() => {
                if (defineRegionBtn) defineRegionBtn.click();
              }, 50);
            }
            break;
          case "[":
            clips.forEach((c) => (c.selected = c.end <= t + 0.1));
            renderTimeline();
            break;
          case "]":
            clips.forEach((c) => (c.selected = c.start >= t - 0.1));
            renderTimeline();
            break;
          case "backspace":
          case "delete":
            const originalLength = clips.length;
            clips = clips.filter((c) => !c.selected);
            if (clips.length !== originalLength) {
              loopRegion = null;
              saveState(); // 紀錄刪除
              renderTimeline();
            }
            break;
          case "enter": // 2) 按下 enter 鍵代表一鍵填滿
            e.preventDefault();
            if (updateZoom) updateZoom(1);
            break;
          case " ": // 空白鍵
            e.preventDefault();
            if (video.paused) {
              lastSysTime = performance.now(); // 重置虛擬引擎計時器避免暴衝

              // 確保播放前畫面跳回獨立播放頭正確的影片時間點
              let targetSourceTime = savedPlayTime;
              for (let c of clips) {
                if (savedPlayTime >= c.start && savedPlayTime < c.end) {
                  targetSourceTime =
                    (c.sourceStart || 0) + (savedPlayTime - c.start);
                  break;
                }
              }
              video.currentTime = targetSourceTime;
              video.play();
              // 顯示播放圖示 (三角形)
              playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            } else {
              video.pause();
              // 顯示暫停圖示 (雙直線)
              playPauseIcon.innerHTML =
                '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            }

            // 觸發動畫
            playPauseOverlay.classList.remove("opacity-0");
            playPauseOverlay.firstElementChild.classList.remove("scale-150");
            playPauseOverlay.firstElementChild.classList.add("scale-100");

            clearTimeout(playPauseTimer);
            playPauseTimer = setTimeout(() => {
              playPauseOverlay.classList.add("opacity-0");
              playPauseOverlay.firstElementChild.classList.remove("scale-100");
              playPauseOverlay.firstElementChild.classList.add("scale-150");
            }, 500);
            break;
        }
      });

      // --- 縮放編輯區功能 ---
      const zoomSliderUI = document.getElementById("zoom-slider");
      const zoomInBtn = document.getElementById("zoom-in-btn");
      const zoomOutBtn = document.getElementById("zoom-out-btn");
      const zoomFitBtn = document.getElementById("zoom-fit-btn");

      let updateZoom;

      if (zoomSliderUI) {
        updateZoom = (val) => {
          const contentEl = document.getElementById("timeline-content");
          if (!contentEl) return;
          let zoom = parseFloat(val);
          zoom = Math.max(1, Math.min(zoom, 10)); // 縮放比例 1x 到 10x
          zoomSliderUI.value = zoom;
          contentEl.style.width = `${zoom * 100}%`;

          // 確保重新渲染軌道 UI
          if (duration) renderTimeline();
        };

        zoomSliderUI.addEventListener("input", (e) =>
          updateZoom(e.target.value),
        );
        zoomInBtn.addEventListener("click", () =>
          updateZoom(parseFloat(zoomSliderUI.value) + 0.5),
        );
        zoomOutBtn.addEventListener("click", () =>
          updateZoom(parseFloat(zoomSliderUI.value) - 0.5),
        );
        zoomFitBtn.addEventListener("click", () => updateZoom(1));

        // 1) 當滑鼠移至灰色區域時，按住 command/ctrl + 滾輪縮放
        timelineContainer.addEventListener(
          "wheel",
          (e) => {
            if (e.metaKey || e.ctrlKey) {
              e.preventDefault();
              const delta = e.deltaY > 0 ? -0.5 : 0.5;
              updateZoom(parseFloat(zoomSliderUI.value) + delta);
            }
          },
          { passive: false },
        );
      }

      // --- 區域命名與匯出功能 ---
      let customRegions = [];
      let activeRegionIndex = -1;

      // 在 footer 加入一個容器供按鈕放置
      const footer = document.querySelector("footer");
      const regionContainer = document.createElement("div");
      regionContainer.id = "custom-regions-container";
      regionContainer.className = "flex gap-2 p-2 px-4 flex-wrap mt-auto";
      footer.appendChild(regionContainer);

      function renderRegions() {
        regionContainer.innerHTML = "";
        
        // 更新右側獨立最愛按鈕的視覺外觀
        if (favRegionBtn) {
          if (activeRegionIndex !== -1 && customRegions[activeRegionIndex] && customRegions[activeRegionIndex].favorite) {
            favRegionBtn.style.backgroundColor = "#eab308"; // 亮黃色背景
            favRegionBtn.style.color = "#ffffff";
          } else {
            favRegionBtn.style.backgroundColor = "";
            favRegionBtn.style.color = "";
          }
        }

        customRegions.forEach((reg, index) => {
          const isActive = activeRegionIndex === index;
          const btn = document.createElement("div");

          // 啟用拖曳功能
          btn.draggable = true;
          btn.ondragstart = (e) => {
            e.dataTransfer.setData("text/plain", index);
            btn.style.opacity = "0.5";
          };
          btn.ondragover = (e) => {
            e.preventDefault();
            // 顯示黃色輔助線作為插入點提示
            btn.classList.add("border-l-yellow-400");
            btn.classList.remove("border-transparent");
          };
          btn.ondragleave = () => {
            btn.classList.add("border-transparent");
            btn.classList.remove("border-l-yellow-400");
          };
          btn.ondragend = () => renderRegions();
          btn.ondrop = (e) => {
            e.preventDefault();
            btn.classList.add("border-transparent");
            btn.classList.remove("border-l-yellow-400");
            const fromIdx = parseInt(e.dataTransfer.getData("text/plain"));
            if (fromIdx !== index) {
              const [moved] = customRegions.splice(fromIdx, 1);
              customRegions.splice(index, 0, moved);
              // 同步更新高亮索引
              if (activeRegionIndex === fromIdx) {
                activeRegionIndex = index;
              } else if (
                activeRegionIndex > fromIdx &&
                activeRegionIndex <= index
              ) {
                activeRegionIndex--;
              } else if (
                activeRegionIndex < fromIdx &&
                activeRegionIndex >= index
              ) {
                activeRegionIndex++;
              }
              renderRegions();
              renderTimeline();
            }
          };

          // 檢查此區間是否被完全包含在另一個更大的區間中
          const isContained = customRegions.some(
            (other, i) =>
              index !== i &&
              reg.start >= other.start &&
              reg.end <= other.end &&
              other.end - other.start > reg.end - reg.start,
          );

          // 我的最愛按鈕改用亮眼的翡翠綠/黃金色雙重厚邊框以及外發光來顯示不同顏色的框
          const favBorder = reg.favorite ? "border-2 border-amber-400 shadow-[0_0_10px_rgba(245,158,11,0.8)]" : "border border-transparent";

          const bgClass = isContained
            ? isActive
              ? "bg-yellow-400 ring-2 ring-white shadow-lg scale-105 text-gray-900"
              : "bg-yellow-600 hover:bg-yellow-500 opacity-80 text-white"
            : isActive
              ? "bg-purple-400 ring-2 ring-white shadow-lg scale-105"
              : "bg-purple-600 hover:bg-purple-500 opacity-80";

          const closeClass = isContained
            ? isActive
              ? "text-gray-600 hover:text-gray-900"
              : "text-yellow-200 hover:text-white"
            : "text-purple-200 hover:text-white";

          btn.className = `px-3 py-1 rounded-full text-xs flex items-center gap-2 cursor-move transition-all ${favBorder} ${bgClass}`;
          btn.innerHTML = `<span>${reg.name}</span> <span class="${closeClass} font-bold ml-1 cursor-pointer" onclick="event.stopPropagation(); customRegions.splice(${index},1); if(activeRegionIndex===${index})activeRegionIndex=-1; saveState(); renderRegions(); renderTimeline();">×</span>`;
          btn.onclick = () => {
            activeRegionIndex = index;
            savedPlayTime = reg.start;
            video.currentTime = reg.start;
            loopRegion = { start: reg.start, end: reg.end };
            renderTimeline();
            renderRegions();

            // === 新增：確保按下區間後自動播放 ===
            if (video.paused) {
              video.play();
            }

            // 自動平滑捲動到該區間的位置，減去 50px 是為了讓左側保留一點視覺空間避免貼齊邊緣
            const maxTime = Math.max(duration, ...clips.map((c) => c.end));
            const contentWidth =
              document.getElementById("timeline-content").scrollWidth;
            timelineContainer.scrollTo({
              left: (reg.start / maxTime) * contentWidth - 50,
              behavior: "smooth",
            });
          };
          regionContainer.appendChild(btn);
        });
        if (typeof window.updateSheetWindowUI === "function") {
          window.updateSheetWindowUI();
        }
      }

      // 綁定右鍵事件到 loopRegion
      loopRegionEl.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (!loopRegion) return;
        const name = prompt(
          i18nData[currentLang].promptRegion,
          i18nData[currentLang].promptRegionDefault,
        );
        if (name) {
          customRegions.push({
            name,
            start: loopRegion.start,
            end: loopRegion.end,
          });
          saveState();
          renderRegions();
        }
      });

      // 綁定「定義區間」按鈕
      const defineRegionBtn = document.getElementById("define-region-btn");
      if (defineRegionBtn) {
        defineRegionBtn.addEventListener("click", () => {
          if (!loopRegion) {
            alert(i18nData[currentLang].alertSelect);
            return;
          }
          const name = prompt(
            i18nData[currentLang].promptRegion,
            i18nData[currentLang].promptRegionDefault +
              (customRegions.length + 1),
          );
          if (name) {
            customRegions.push({
              name,
              start: loopRegion.start,
              end: loopRegion.end,
            });
            saveState();
            renderRegions();
            renderTimeline();
          }
        });
      }

      // 2) 拼接片段邏輯：合併為單一完整物件，徹底消除視覺縫隙，時長為片段完美相加
      const mergeClipsBtn = document.getElementById("merge-clips-btn");
      if (mergeClipsBtn) {
        mergeClipsBtn.onclick = () => {
          const selected = clips
            .filter((c) => c.selected)
            .sort((a, b) => a.start - b.start);
          if (selected.length < 2) return;

          const newStart = selected[0].start;
          // 精準加總所有片段的實際時長，確保總長度絕對不縮短也不增加
          const totalDuration = selected.reduce(
            (sum, clip) => sum + (clip.end - clip.start),
            0,
          );
          const newEnd = newStart + totalDuration;
          const newSourceStart = selected[0].sourceStart;

          // 自動清理對應的自定義區塊 (恢復原本正確的清理邏輯)
          customRegions = customRegions.filter(
            (reg) =>
              !selected.some(
                (c) =>
                  Math.abs(reg.start - c.start) < 0.1 &&
                  Math.abs(reg.end - c.end) < 0.1,
              ),
          );

          // 刪除原本的碎片段，直接合併成一個全新的完整物件，徹底消除中間的縫隙
          clips = clips.filter((c) => !c.selected);
          clips.push({
            id: Date.now(),
            start: newStart,
            end: newEnd,
            sourceStart: newSourceStart,
            selected: true,
            track: selected[0].track || 0,
          });
          clips.sort((a, b) => a.start - b.start);

          loopRegion = null;
          saveState();
          renderTimeline();
          renderRegions();
        };
      }

      let currentFileHandle = null;
      let currentJsonName = "project.json";

      // 匯出功能 (支援覆蓋原檔)
      document
        .getElementById("export-btn")
        .addEventListener("click", async () => {
          const data = JSON.stringify({
            videoName: currentVideoName,
            clips,
            customRegions,
            pdfAnchors,
            pdfTextAnnotations,
            pdfBoxAnnotations,
          });

          // 檢查瀏覽器是否支援 File System Access API
          if ("showSaveFilePicker" in window) {
            try {
              // 若尚未取得檔案權限，則跳出選擇視窗 (自動帶入原檔名)
              if (!currentFileHandle) {
                currentFileHandle = await window.showSaveFilePicker({
                  suggestedName: currentJsonName,
                  types: [
                    {
                      description: "JSON File",
                      accept: { "application/json": [".json"] },
                    },
                  ],
                });
                currentJsonName = currentFileHandle.name; // 紀錄使用者最終決定的檔名
              }
              const writable = await currentFileHandle.createWritable();
              await writable.write(data);
              await writable.close();

              // 顯示畫面輕量提示
              if (speedToast) {
                speedToast.textContent = "存檔成功";
                speedToast.classList.remove("opacity-0");
                clearTimeout(speedToastTimer);
                speedToastTimer = setTimeout(() => {
                  speedToast.classList.add("opacity-0");
                }, 2000);
              }
            } catch (err) {
              if (err.name !== "AbortError") fallbackDownload(data);
            }
          } else {
            fallbackDownload(data);
          }
        });

      function fallbackDownload(data) {
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = currentJsonName; // 確保傳統下載模式也能帶入原檔名
        a.click();
      }

      // 攔截原本按鈕的點擊事件，改用現代 API 取得檔案讀寫權限
      const importBtn = document.getElementById("import-btn");
      if (importBtn) {
        importBtn.removeAttribute("onclick");
        importBtn.addEventListener("click", async (e) => {
          e.preventDefault();
          if ("showOpenFilePicker" in window) {
            try {
              const handles = await window.showOpenFilePicker({
                multiple: true,
                types: [
                  {
                    description: "所有支援的檔案 (JSON, 影片, PDF)",
                    accept: {
                      "*/*": [
                        ".json",
                        ".mp4",
                        ".mov",
                        ".avi",
                        ".webm",
                        ".mkv",
                        ".pdf",
                      ],
                    },
                  },
                ],
              });

              let files = [];
              for (const handle of handles) {
                const file = await handle.getFile();
                files.push(file);
                // 儲存 JSON 的 handle 以供後續快速 (Cmd+S) 覆蓋存檔
                if (file.name.endsWith(".json")) {
                  currentFileHandle = handle;
                  currentJsonName = file.name;
                }
              }
              processMultipleFiles(files);
            } catch (err) {
              if (err.name !== "AbortError") console.error(err);
            }
          } else {
            document.getElementById("import-input").click();
          }
        });
      }

      // 匯入功能 (供舊版瀏覽器或回退方案使用)
      document
        .getElementById("import-input")
        .addEventListener("change", (e) => {
          const files = Array.from(e.target.files);
          if (files.length > 0) {
            const jsonFile = files.find((f) => f.name.endsWith(".json"));
            if (jsonFile) {
              currentFileHandle = null;
              currentJsonName = jsonFile.name;
            }
            processMultipleFiles(files);
          }
          e.target.value = ""; // 清除 value 允許重複選擇相同檔案
        });

      async function processMultipleFiles(files) {
        let videoFile = null;
        let jsonFile = null;
        let pdfFile = null;

        files.forEach((file) => {
          if (
            file.type.startsWith("video/") ||
            file.name.match(/\.(mp4|mov|webm|avi|mkv)$/i)
          )
            videoFile = file;
          else if (
            file.name.endsWith(".json") ||
            file.type === "application/json"
          )
            jsonFile = file;
          else if (
            file.name.endsWith(".pdf") ||
            file.type === "application/pdf"
          )
            pdfFile = file;
        });

        // 1. 處理 JSON (先讀取，確保 pendingImportData 準備好)
        if (jsonFile) {
          await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (event) => {
              const data = JSON.parse(event.target.result);
              customRegions = data.customRegions || [];
              pdfAnchors = data.pdfAnchors || [];
              pdfTextAnnotations = data.pdfTextAnnotations || [];
              pdfBoxAnnotations = data.pdfBoxAnnotations || [];

              document
                .getElementById("sheet-music-btn")
                .classList.remove("hidden");
              renderRegions();
              if (typeof window.updateSheetWindowUI === "function")
                window.updateSheetWindowUI();
              if (sheetWindow && !sheetWindow.closed) {
                if (typeof window.renderPdfTextAnnotations === "function") window.renderPdfTextAnnotations(sheetWindow);
                if (typeof window.renderPdfBoxAnnotations === "function") window.renderPdfBoxAnnotations(sheetWindow);
              }

              if (data.videoName) {
                currentVideoName = data.videoName;
                pendingImportData = data;
                // 若沒有一起拉入影片，才提醒選擇影片
                if (!videoFile) {
                  setTimeout(() => {
                    alert(
                      `請選擇對應的影片檔 / Please select the corresponding video file:\n\n👉 ${data.videoName}`,
                    );
                    document.getElementById("video-upload").click();
                  }, 50);
                }
              } else {
                clips = data.clips;
                saveState();
                renderTimeline();
              }
              resolve();
            };
            reader.readAsText(jsonFile);
          });
        }

        // 2. 處理影片 (載入後自動觸發 loadedmetadata 讀取上面的 pendingImportData)
        if (videoFile) {
          currentVideoName = videoFile.name;
          const url = URL.createObjectURL(videoFile);
          video.src = url;
          video.load();
          extractAudioWaveform(videoFile);
        }

        // 3. 處理 PDF 樂譜 (開啟視窗並傳入資料)
        if (pdfFile) {
          // 【修復】改用 Blob URL，極大節省記憶體，避免 iPad 跨視窗傳遞 ArrayBuffer 失敗
          const pdfUrl = URL.createObjectURL(pdfFile);
          window.pendingPdfUrl = pdfUrl;

          // 觸發開啟樂譜視窗
          document.getElementById("sheet-music-btn").click();

          // 輪詢等待子視窗就緒後，直接自動載入 PDF
          const checkInterval = setInterval(() => {
            if (
              sheetWindow &&
              !sheetWindow.closed &&
              sheetWindow.loadPdfInWindowGlobally
            ) {
              clearInterval(checkInterval);
              sheetWindow.loadPdfInWindowGlobally(window.pendingPdfUrl);
              window.pendingPdfUrl = null;
            }
          }, 200);
        }
      }

      // 產生播放速度按鈕
      const speedButtonsContainer = document.getElementById("speed-buttons");
      [0.5, 0.8, 1.0, 2.0, 3.0, 4.0].forEach((s) => {
        const btn = document.createElement("button");
        btn.className =
          "speed-btn px-3 py-1.5 mx-0.5 rounded-lg text-sm font-bold transition-all border border-gray-600 bg-gray-700 text-gray-300 hover:bg-blue-500 hover:text-white";
        btn.dataset.speed = s.toFixed(1);
        btn.textContent = s.toFixed(1) + "x";
        btn.onclick = () => updateSpeed(s);
        speedButtonsContainer.appendChild(btn);
      });

      // 載入時預設觸發一次 1.0x 以初始化選取外觀
      updateSpeed(1.0);

      // 預設開啟預覽
      isHoverPreview = true;

      // --- 多國語言設定 ---
      const i18nData = {
        tw: {
          appTitle: "老人的播放器",
          loadVideo: "載入影片",
          export: "匯出",
          import: "匯入",
          modeLabel: "當前模式:",
          modeA: "選取 (A)",
          modeB: "分割 (B)",
          helpA: "選取模式",
          helpB: "分割模式",
          helpL: "左全選",
          helpR: "右全選",
          helpDel: "刪除",
          keyShift: "Shift+點擊",
          helpShift: "兩點框選",
          keySpace: "空白鍵",
          helpSpace: "播放/暫停",
          defineRegion: "定義區間",
          zoomFit: "一鍵填滿 (適應螢幕)",
          zoomOut: "縮小",
          zoomIn: "放大",
          promptRegion: "請輸入區域名稱:",
          promptRegionDefault: "區域",
          alertSelect: "請先在時間軸上框選一個範圍！",
        },
        en: {
          appTitle: "OLDMAN'S Player",
          loadVideo: "Load Video",
          export: "Export",
          import: "Import",
          modeLabel: "Current Mode:",
          modeA: "Select (A)",
          modeB: "Split (B)",
          helpA: "Select Mode",
          helpB: "Split Mode",
          helpL: "Select Left",
          helpR: "Select Right",
          helpDel: "Delete",
          keyShift: "Shift+Click",
          helpShift: "Range Select",
          keySpace: "Spacebar",
          helpSpace: "Play/Pause",
          defineRegion: "Define Region",
          zoomFit: "Fit to Screen",
          zoomOut: "Zoom Out",
          zoomIn: "Zoom In",
          promptRegion: "Enter region name:",
          promptRegionDefault: "Region",
          alertSelect: "Please select a range on the timeline first!",
        },
      };

      let currentLang = "tw";

      function setLang(lang) {
        currentLang = lang;

        // 處理一般文字替換
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (i18nData[lang][key]) el.textContent = i18nData[lang][key];
        });

        // 處理 title 提示替換
        document.querySelectorAll("[data-i18n-title]").forEach((el) => {
          const key = el.getAttribute("data-i18n-title");
          if (i18nData[lang][key]) el.title = i18nData[lang][key];
        });

        // 確保模式文字正確同步
        if (currentMode === "A") {
          currentModeText.textContent = i18nData[lang].modeA;
        } else {
          currentModeText.textContent = i18nData[lang].modeB;
        }

        // 更新按鈕樣式
        const btnTw = document.getElementById("lang-tw");
        const btnEn = document.getElementById("lang-en");
        if (lang === "tw") {
          btnTw.className =
            "px-3 py-1 text-sm bg-blue-600 text-white font-bold transition-colors";
          btnEn.className =
            "px-3 py-1 text-sm text-gray-300 hover:bg-gray-600 font-bold transition-colors";
        } else {
          btnEn.className =
            "px-3 py-1 text-sm bg-blue-600 text-white font-bold transition-colors";
          btnTw.className =
            "px-3 py-1 text-sm text-gray-300 hover:bg-gray-600 font-bold transition-colors";
        }
      }

      // --- 調整下方編輯區高度功能 ---
      const resizer = document.getElementById("resizer");
      const editorFooter = document.getElementById("editor-footer");
      let isResizingArea = false;

      function startResize(e) {
        isResizingArea = true;
        document.body.style.cursor = "row-resize";
        document.body.style.userSelect = "none"; // 防止拖曳時反白選取到文字
      }

      function doResize(e) {
        if (!isResizingArea) return;

        // 支援滑鼠與觸控的 Y 座標取得
        const clientY = e.type.includes("touch")
          ? e.touches[0].clientY
          : e.clientY;

        // 計算新的高度：視窗總高度 - 目前的 Y 座標
        let newHeight = window.innerHeight - clientY;

        // 設定最小高度與最大高度限制，避免將上方影片或下方介面壓扁破版
        if (newHeight < 100) newHeight = 100;
        if (newHeight > window.innerHeight - 150)
          newHeight = window.innerHeight - 150;

        editorFooter.style.height = newHeight + "px";
      }

      function stopResize() {
        if (isResizingArea) {
          isResizingArea = false;
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
          // 調整完畢後重新渲染時間軸確保波形與元素正確貼合
          if (duration) renderTimeline();
        }
      }

      resizer.addEventListener("mousedown", startResize);
      resizer.addEventListener("touchstart", startResize, { passive: true });

      document.addEventListener("mousemove", doResize);
      document.addEventListener("touchmove", doResize, { passive: true });

      document.addEventListener("mouseup", stopResize);
      document.addEventListener("touchend", stopResize);

      // --- 樂譜功能 (另開新視窗) ---
      let sheetWindow = null;
      let pdfTextAnnotations = []; // 儲存文字註解項目
      let pdfBoxAnnotations = []; // 儲存方框註解項目
      let activeTextId = null; // 目前選取的文字項目 id
      let activeBoxId = null; // 目前選取的方框項目 id
      const sheetMusicBtn = document.getElementById("sheet-music-btn");

      sheetMusicBtn.addEventListener("click", () => {
        // 如果視窗已經存在，直接聚焦
        if (sheetWindow && !sheetWindow.closed) {
          sheetWindow.focus();
          return;
        }

        // 開啟新視窗
        sheetWindow = window.open("", "_blank", "width=1100,height=800");

        // 寫入新視窗的 HTML 架構 (包含文字面板、方框面板與觸控手勢容器)
        sheetWindow.document.write(`
            <!DOCTYPE html>
            <html lang="zh-TW">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
                <title>樂譜編輯模式</title>
                <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
