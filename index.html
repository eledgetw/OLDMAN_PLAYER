<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">OLDMAN'S Player - 老人的播放器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>
    <style>
      /* 隱藏預設卷軸讓版面乾淨 */
      /* 隱藏預設卷軸讓版面乾淨2 */
      ::-webkit-scrollbar {
        display: none;
      }
      .clip-segment {
        transition: background-color 0.1s;
      }
      .clip-segment.selected {
        border: 2px solid #3b82f6;
        background-color: rgba(59, 130, 246, 0.5);
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-white h-[100dvh] flex flex-col overflow-hidden font-sans pb-2"
  >
    <!-- 頂部導覽與控制區 -->
    <header
      class="bg-gray-800 p-4 flex flex-wrap gap-4 items-center border-b border-gray-700 shadow-md z-10"
    >
      <h1 class="text-xl font-bold flex items-center gap-2">
        <svg
          class="w-6 h-6 text-blue-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
          ></path>
        </svg>
        <span data-i18n="appTitle">老人的播放器</span>
      </h1>
      <div class="flex items-center gap-2">
        <input type="file" id="video-upload" accept="video/*" class="hidden" />
        <button
          onclick="document.getElementById('video-upload').click()"
          data-i18n="loadVideo"
          class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-lg text-sm"
        >
          載入影片
        </button>
        <input
          type="file"
          id="import-input"
          accept=".json,video/*,.pdf"
          multiple
          class="hidden"
        />
        <button
          id="export-btn"
          data-i18n="export"
          class="bg-green-700 hover:bg-green-600 text-white px-3 py-1 rounded-lg text-sm"
        >
          匯出
        </button>
        <button
          id="import-btn"
          data-i18n="import"
          class="bg-red-600 hover:bg-red-500 text-white px-5 py-2 rounded-lg text-base font-bold shadow-lg transition-colors"
          onclick="document.getElementById('import-input').click()"
        >
          匯入
        </button>
        <button
          id="sheet-music-btn"
          class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded-lg text-sm hidden flex items-center gap-1 shadow"
          title="開啟樂譜"
        >
          <svg
            class="w-4 h-4 text-yellow-300"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 13H9.5v-1.25c0-.62-.5-1.12-1.12-1.12H8.25V11.5h3.25V15zM13 9V3.5L18.5 9H13z"
            /></svg
          >樂譜
        </button>
        <button
          id="undo-btn"
          class="p-2 rounded-lg bg-gray-600 hover:bg-gray-500 text-white transition-colors"
          title="上一動 (Ctrl+Z)"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"
            />
          </svg>
        </button>
        <button
          id="redo-btn"
          class="p-2 rounded-lg bg-gray-600 hover:bg-gray-500 text-white transition-colors"
          title="下一動 (Ctrl+Y)"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"
            />
          </svg>
        </button>
        <button
          id="preview-toggle"
          class="p-2 rounded-lg bg-green-600 text-white"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
            />
          </svg>
        </button>
      </div>
      <div
        id="speed-buttons"
        class="flex items-center gap-1 bg-gray-700 p-1 rounded-lg"
      >
        <span id="speed-display" class="text-xs font-mono px-2">1.0x</span>
        <input
          type="range"
          id="speed-slider"
          min="0.1"
          max="4"
          step="0.1"
          value="1"
          class="w-16 h-1 accent-blue-500"
        />
      </div>
      <div
        class="ml-auto flex bg-gray-700 rounded-lg overflow-hidden border border-gray-600"
      >
        <button
          id="lang-tw"
          class="px-3 py-1 text-sm bg-blue-600 text-white font-bold transition-colors"
          onclick="setLang('tw')"
        >
          中文
        </button>
        <button
          id="lang-en"
          class="px-3 py-1 text-sm text-gray-300 hover:bg-gray-600 font-bold transition-colors"
          onclick="setLang('en')"
        >
          ENG
        </button>
      </div>
    </header>

    <main
      class="flex-1 min-h-0 flex justify-center items-center bg-black relative p-4"
    >
      <video
        id="video-player"
        class="max-h-full max-w-full rounded shadow-lg object-contain transition-opacity duration-200 cursor-pointer"
        playsinline
      ></video>

            <div id="crop-box" class="fixed border-2 border-blue-500 bg-blue-500/30 pointer-events-none hidden z-50"></div>

            <button
        id="crop-mode-btn"
        class="absolute right-4 top-24 bg-gray-800/80 hover:bg-gray-700 text-white p-3 rounded-full shadow-lg backdrop-blur-sm transition-all z-40"
        title="框選放大"
      >
        <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8V5a2 2 0 012-2h3m10 0h3a2 2 0 012 2v3m-2 13h-3a2 2 0 01-2-2v-3m-10 0H5a2 2 0 01-2-2v-3" />
        </svg>
      </button>

      <button
        id="prev-region-btn"
        class="absolute right-4 top-[152px] bg-gray-800/80 hover:bg-gray-700 text-blue-400 p-3 rounded-full shadow-lg backdrop-blur-sm transition-all z-40 font-bold text-lg flex items-center justify-center w-12 h-12"
        title="上一段區間"
      >
        ←
      </button>

      <button
        id="next-region-btn"
        class="absolute right-4 top-[212px] bg-gray-800/80 hover:bg-gray-700 text-blue-400 p-3 rounded-full shadow-lg backdrop-blur-sm transition-all z-40 font-bold text-lg flex items-center justify-center w-12 h-12"
        title="下一段區間"
      >
        →
      </button>

      <button
        id="fav-region-btn"
        class="absolute right-4 top-[272px] bg-gray-800/80 hover:bg-gray-700 text-yellow-400 p-3 rounded-full shadow-lg backdrop-blur-sm transition-all z-40 font-bold text-base flex items-center justify-center w-12 h-12"
        title="將當前區間加入/取消我的最愛"
      >
        ★
      </button>

      <div
        id="play-pause-overlay"
        class="absolute inset-0 flex items-center justify-center pointer-events-none z-50 opacity-0 transition-opacity duration-300"
      >
        <div
          class="bg-black/60 rounded-full p-6 text-white transform scale-150 transition-transform duration-300 flex items-center justify-center w-24 h-24"
        >
          <svg
            id="play-pause-icon"
            class="w-12 h-12"
            fill="currentColor"
            viewBox="0 0 24 24"
          ></svg>
        </div>
      </div>

      <div
        id="mode-indicator"
        class="absolute top-4 left-4 bg-gray-800/80 text-white px-3 py-1 rounded text-sm backdrop-blur-sm hidden font-mono"
      >
        <span data-i18n="modeLabel">當前模式:</span>
        <span
          id="current-mode-text"
          class="text-blue-400 font-bold"
          data-i18n="modeA"
          >選取 (A)</span
        >
      </div>
      <div
        id="speed-toast"
        class="absolute top-16 left-4 bg-black/80 text-white text-2xl font-bold px-4 py-2 rounded-lg backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 z-50"
      >
        1.0x
      </div>

      <!-- 樂譜圖示按鈕 -->
      <button
        id="sheet-music-btn"
        class="absolute right-4 top-1/2 -translate-y-1/2 bg-gray-800/80 hover:bg-gray-700 text-white p-3 rounded-full shadow-lg backdrop-blur-sm transition-all z-40 hidden"
        title="樂譜編輯模式"
      >
        <svg
          class="w-8 h-8 text-blue-400"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 13H9.5v-1.25c0-.62-.5-1.12-1.12-1.12H8.25V11.5h3.25V15zM13 9V3.5L18.5 9H13z"
          />
        </svg>
      </button>

      <!-- 樂譜編輯視窗 -->
      <div
        id="sheet-music-modal"
        class="absolute inset-0 bg-gray-900 z-[100] hidden flex flex-col"
      >
        <div
          class="bg-gray-800 p-3 flex justify-between items-center border-b border-gray-700 shadow-md"
        >
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <svg
              class="w-5 h-5 text-blue-400"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2h12c1.1 0 2-.9 2-2V8l-6-6z"
              />
            </svg>
            樂譜編輯模式
          </h2>
          <div class="flex gap-2">
            <input
              type="file"
              id="pdf-upload"
              accept="application/pdf"
              class="hidden"
            />
            <button
              onclick="document.getElementById('pdf-upload').click()"
              class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-sm"
            >
              載入 PDF
            </button>
            <button
              id="close-sheet-modal"
              class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-sm"
            >
              關閉
            </button>
          </div>
        </div>
        <div class="flex-1 flex min-h-0">
          <!-- 左側：PDF 原文件 -->
          <div
            id="pdf-viewer-container"
            class="flex-1 bg-gray-600 overflow-auto relative flex flex-col items-center py-4 gap-4 scroll-smooth"
          >
            <!-- PDF 頁面會在這裡生成 -->
            <div id="pdf-placeholder" class="text-gray-400 mt-20">
              請載入 PDF 文件
            </div>
          </div>
          <!-- 右側：定義區間按鈕列表 -->
          <div
            class="w-min min-w-[70px] max-w-[45vw] bg-gray-800 border-l border-gray-700 p-4 flex flex-col gap-2 overflow-y-auto"
            id="sheet-regions-list"
          >
            <div class="text-sm text-gray-400 mb-2 leading-relaxed">
              拖曳下方按鈕至左側 PDF 建立錨點。<br />點擊按鈕可跳轉至該錨點位置。
            </div>
            <!-- 按鈕將由 JS 動態生成 -->
          </div>
        </div>
      </div>
    </main>

    <div
      id="resizer"
      class="h-2 bg-gray-700 hover:bg-blue-500 cursor-row-resize flex-none z-40 transition-colors"
      title="上下拖曳調整大小"
    ></div>

    <footer
      id="editor-footer"
      class="bg-gray-800 border-t border-gray-700 flex flex-col select-none"
      style="height: 176px"
    >
      <div
        class="p-2 bg-gray-900/50 text-xs text-gray-400 flex justify-between items-center overflow-x-auto whitespace-nowrap"
      >
        <div class="flex gap-4">
          <button
            type="button"
            onclick="setMode('A')"
            class="cursor-pointer hover:text-white transition-colors text-left"
          >
            <strong class="text-white">A</strong>:
            <span data-i18n="helpA">選取模式</span>
          </button>
          <button
            type="button"
            onclick="setMode('B')"
            class="cursor-pointer hover:text-white transition-colors text-left"
          >
            <strong class="text-white">B</strong>:
            <span data-i18n="helpB">分割模式</span>
          </button>
          <button
            type="button"
            onclick="
              clips.forEach(
                (c) => (c.selected = c.end <= video.currentTime + 0.1),
              );
              renderTimeline();
            "
            class="cursor-pointer hover:text-white transition-colors text-left"
          >
            <strong class="text-white">[</strong>:
            <span data-i18n="helpL">左全選</span>
          </button>
          <button
            type="button"
            onclick="
              clips.forEach(
                (c) => (c.selected = c.start >= video.currentTime - 0.1),
              );
              renderTimeline();
            "
            class="cursor-pointer hover:text-white transition-colors text-left"
          >
            <strong class="text-white">]</strong>:
            <span data-i18n="helpR">右全選</span>
          </button>
          <button
            type="button"
            onclick="
              if (clips.some((c) => c.selected)) {
                clips = clips.filter((c) => !c.selected);
                loopRegion = null;
                saveState();
                renderTimeline();
              }
            "
            class="cursor-pointer hover:text-white transition-colors text-left"
          >
            <strong class="text-white">Del/Backspace</strong>:
            <span data-i18n="helpDel">刪除</span>
          </button>
          <span
            ><strong class="text-white" data-i18n="keyShift">Shift+點擊</strong
            >: <span data-i18n="helpShift">兩點框選</span></span
          >
          <span
            ><strong class="text-white" data-i18n="keySpace">空白鍵</strong>:
            <span data-i18n="helpSpace">播放/暫停</span></span
          >
          <button
            type="button"
            onclick="
              activeRegionIndex = -1;
              loopRegion = null;
              clips.forEach((c) => (c.selected = false));
              renderRegions();
              renderTimeline();
            "
            class="cursor-pointer hover:text-white transition-colors text-left"
          >
            <strong class="text-white">M</strong>: <span>取消區域</span>
          </button>
        </div>
        <div class="flex items-center gap-3 pr-4">
          <button
            id="define-region-btn"
            data-i18n="defineRegion"
            class="bg-gray-700 hover:bg-gray-600 text-gray-300 hover:text-white px-2 py-1 rounded text-xs border border-gray-600 transition"
          >
            定義區間
          </button>
          <button
            id="merge-clips-btn"
            class="bg-indigo-700 hover:bg-indigo-600 text-white px-2 py-1 rounded text-xs border border-indigo-500 ml-2 transition hidden"
          >
            合併片段
          </button>
          <button
            id="zoom-fit-btn"
            class="hover:text-white transition"
            data-i18n-title="zoomFit"
            title="一鍵填滿 (適應螢幕)"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
              ></path>
            </svg>
          </button>
          <button
            id="zoom-out-btn"
            class="hover:text-white transition"
            data-i18n-title="zoomOut"
            title="縮小"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"
              ></path>
            </svg>
          </button>
          <input
            type="range"
            id="zoom-slider"
            min="1"
            max="10"
            step="0.1"
            value="1"
            class="w-40 accent-blue-500"
          />
          <button
            id="zoom-in-btn"
            class="hover:text-white transition"
            data-i18n-title="zoomIn"
            title="放大"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <div
        id="timeline-container"
        class="flex-1 relative mx-4 mt-2 mb-0 bg-gray-700 rounded-lg cursor-crosshair overflow-x-auto overflow-y-hidden group"
      >
        <div
          id="timeline-content"
          class="relative h-full w-full origin-left transition-all duration-75"
        >
          <div id="timeline-bg" class="absolute inset-0 z-0"></div>

          <div
            class="absolute top-4 bottom-1 left-0 right-0 border-t border-gray-600 border-dashed pointer-events-none opacity-50 z-0"
          ></div>
          <div
            id="clips-track"
            class="absolute inset-0 z-10 pointer-events-none flex flex-col"
          >
            <div id="track-0" class="flex-1 relative pointer-events-none"></div>
          </div>

          <div
            id="loop-region"
            class="absolute inset-y-0 bg-green-500/30 border-x border-green-500 hidden z-20 pointer-events-none"
          ></div>

          <div
            id="playhead"
            class="absolute top-0 bottom-0 w-0.5 bg-red-500 z-30 pointer-events-none"
          >
            <div
              class="absolute -top-1 -translate-x-1/2 w-3 h-3 bg-red-500 rotate-45"
            ></div>
          </div>
          <div
            id="hover-line"
            class="absolute top-0 bottom-0 w-px bg-yellow-400 z-20 pointer-events-none hidden"
          ></div>
        </div>
      </div>
    </footer>

    <script>
      const video = document.getElementById("video-player");
      const upload = document.getElementById("video-upload");
      const speedSlider = document.getElementById("speed-slider");
      const speedDisplay = document.getElementById("speed-display");
      const timelineContainer = document.getElementById("timeline-container");
      const timelineBg = document.getElementById("timeline-bg");
      const clipsTrack = document.getElementById("clips-track");
      const playhead = document.getElementById("playhead");
      const loopRegionEl = document.getElementById("loop-region");
      const modeIndicator = document.getElementById("mode-indicator");
      const currentModeText = document.getElementById("current-mode-text");
      const previewToggle = document.getElementById("preview-toggle");
      const undoBtn = document.getElementById("undo-btn");
      const redoBtn = document.getElementById("redo-btn");
      const hoverLine = document.getElementById("hover-line");
      const speedToast = document.getElementById("speed-toast");
      const playPauseOverlay = document.getElementById("play-pause-overlay");
      const playPauseIcon = document.getElementById("play-pause-icon");
      const cropModeBtn = document.getElementById("crop-mode-btn");
      const cropBox = document.getElementById("crop-box");
      let playPauseTimer = null;

      const prevRegionBtn = document.getElementById("prev-region-btn");
      const nextRegionBtn = document.getElementById("next-region-btn");
      const favRegionBtn = document.getElementById("fav-region-btn");

      if (prevRegionBtn) {
        prevRegionBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (customRegions.length === 0) return;
          let targetIdx = activeRegionIndex - 1;
          if (activeRegionIndex === -1) {
            targetIdx = customRegions.length - 1;
          } else if (targetIdx < 0) {
            targetIdx = 0;
          }
          const buttons = regionContainer.querySelectorAll("div");
          if (buttons && buttons[targetIdx]) {
            buttons[targetIdx].click();
          }
        });
      }

      if (nextRegionBtn) {
        nextRegionBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (customRegions.length === 0) return;
          let targetIdx = activeRegionIndex + 1;
          if (activeRegionIndex === -1) {
            targetIdx = 0;
          } else if (targetIdx >= customRegions.length) {
            targetIdx = customRegions.length - 1;
          }
          const buttons = regionContainer.querySelectorAll("div");
          if (buttons && buttons[targetIdx]) {
            buttons[targetIdx].click();
          }
        });
      }

      if (favRegionBtn) {
        favRegionBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (customRegions.length === 0 || activeRegionIndex === -1) return;
          customRegions[activeRegionIndex].favorite = !customRegions[activeRegionIndex].favorite;
          saveState();
          renderRegions();
        });
      }

      // 框選放大狀態
      let isCropMode = false;
      let isCropping = false;
      let isZoomed = false;
      let justCropped = false; // 新增：防止放開滑鼠的瞬間觸發點擊導致立刻復原
      let cropStartX = 0;
      let cropStartY = 0;
      
      if (cropModeBtn) {
        cropModeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          isCropMode = !isCropMode;
          if (isCropMode) {
            cropModeBtn.classList.replace("bg-gray-800/80", "bg-blue-600");
            video.style.cursor = "crosshair";
            if (video.parentElement) video.parentElement.style.cursor = "crosshair";
            // 如果原本是放大狀態，則先復原
            if (isZoomed) {
              video.style.transform = '';
              video.style.transformOrigin = '';
              isZoomed = false;
            }
          } else {
            cropModeBtn.classList.replace("bg-blue-600", "bg-gray-800/80");
            video.style.cursor = "pointer";
            if (video.parentElement) video.parentElement.style.cursor = "";
            cropBox.classList.add("hidden");
            isCropping = false;
          }
        });
      }

      video.parentElement.addEventListener("mousedown", (e) => {
        if (!isCropMode) return;
        e.preventDefault(); // 新增：阻止瀏覽器預設的影片拖曳行為，防止吃掉滑鼠事件
        isCropping = true;
        cropStartX = e.clientX;
        cropStartY = e.clientY;
        cropBox.style.left = `${cropStartX}px`;
        cropBox.style.top = `${cropStartY}px`;
        cropBox.style.width = '0px';
        cropBox.style.height = '0px';
        cropBox.classList.remove("hidden");
      });

      window.addEventListener("mousemove", (e) => {
        if (!isCropping) return;
        const left = Math.min(cropStartX, e.clientX);
        const top = Math.min(cropStartY, e.clientY);
        const width = Math.abs(e.clientX - cropStartX);
        const height = Math.abs(e.clientY - cropStartY);

        cropBox.style.left = `${left}px`;
        cropBox.style.top = `${top}px`;
        cropBox.style.width = `${width}px`;
        cropBox.style.height = `${height}px`;
      });

      window.addEventListener("mouseup", (e) => {
        if (!isCropping) return;
        isCropping = false;
        cropBox.classList.add("hidden");
        
        const width = Math.abs(e.clientX - cropStartX);
        const height = Math.abs(e.clientY - cropStartY);
        
        // 框選範圍太小則忽略，避免誤觸
        if (width < 20 || height < 20) {
          isCropMode = false;
          cropModeBtn.classList.replace("bg-blue-600", "bg-gray-800/80");
          video.style.cursor = "pointer";
          return;
        }

        const left = Math.min(cropStartX, e.clientX);
        const top = Math.min(cropStartY, e.clientY);
        
        const rect = video.getBoundingClientRect();
        const containerRect = video.parentElement.getBoundingClientRect();
        
        // 計算中心點相對於影片元素的百分比
        const originX = ((left - rect.left + width / 2) / rect.width) * 100;
        const originY = ((top - rect.top + height / 2) / rect.height) * 100;
        
        // 忽略原影片大小，以容器尺寸為基準計算最大縮放比例
        const scale = Math.min(containerRect.width / width, containerRect.height / height);
        
        // 計算平移量，使框選中心點對齊畫面正中央
        const cropCenterX = left + width / 2;
        const cropCenterY = top + height / 2;
        const containerCenterX = containerRect.left + containerRect.width / 2;
        const containerCenterY = containerRect.top + containerRect.height / 2;
        const translateX = containerCenterX - cropCenterX;
        const translateY = containerCenterY - cropCenterY;

        video.style.transformOrigin = `${originX}% ${originY}%`;
        video.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        video.style.transition = 'transform 0.3s ease';

        isZoomed = true;
        isCropMode = false; // 結束框選模式
        justCropped = true; // 標記剛剛完成框選
        setTimeout(() => { justCropped = false; }, 200); // 200ms 後解除，防禦 click 事件誤判

        cropModeBtn.classList.replace("bg-blue-600", "bg-gray-800/80");
        video.style.cursor = "pointer";
      });

      // 影片點擊播放/暫停事件
      video.addEventListener("click", () => {
        if (isCropMode || justCropped) return; // 新增：若剛框選完，直接略過這次點擊事件
        if (isZoomed) {
          // 再點擊一次畫面則復原
          video.style.transform = '';
          video.style.transformOrigin = '';
          isZoomed = false;
          return;
        }
        if (!duration) return;

        if (video.paused) {
          lastSysTime = performance.now(); // 重置虛擬引擎計時器避免暴衝
          let targetSourceTime = savedPlayTime;
          for (let c of clips) {
            if (savedPlayTime >= c.start && savedPlayTime < c.end) {
              targetSourceTime =
                (c.sourceStart || 0) + (savedPlayTime - c.start);
              break;
            }
          }
          video.currentTime = targetSourceTime;
          video.play();
          // 顯示播放圖示 (三角形)
          playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        } else {
          video.pause();
          // 顯示暫停圖示 (雙直線)

            '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
